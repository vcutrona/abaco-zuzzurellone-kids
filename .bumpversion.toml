[tool.bumpversion]
current_version = "1.0.1"
commit = true
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "v{new_version}"
allow_dirty = false
message = "Bump version to v{new_version}"

[[tool.bumpversion.files]]
filename = "index.html"
search = 'const VERSION = "{current_version}";'
replace = 'const VERSION = "{new_version}";'
