<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E3F2FF">
<script>
  // Initial theme: follows the device. Set right away to avoid a colour flash.
  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
</script>
<title>Abaco… Zuzzurellone!</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cline x1='5' y1='32' x2='59' y2='32' stroke='%238A6A4F' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='32' r='9.5' fill='%23FFC23D'/%3E%3Ccircle cx='44' cy='32' r='9.5' fill='%23FF5A5F'/%3E%3C/svg%3E">
<style>
  /* ===== Mobile-first styles: the base rules are for phones,
     the @media (min-width) blocks add room for tablets and computers ===== */
  /* Baloo 2 is served with the game (latin subset, SIL Open Font License, see fonts/OFL.txt):
     no external requests, and it works offline */
  @font-face { font-family: "Baloo 2"; font-weight: 500; font-display: swap; src: url("fonts/baloo-2-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Baloo 2"; font-weight: 700; font-display: swap; src: url("fonts/baloo-2-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
  :root {
    color-scheme: light;
    --bg: #E3F2FF;
    --card: #FFFFFF;
    --ink: #1F2A44;
    --muted: #5B6785;
    --off: #C9D3E3;
    --wire: #8A6A4F;
    --green: #12B5A5;
    --green-dark: #0B8478;
    --purple: #8E5CF6;
    --purple-dark: #6A3FD0;
    --yellow: #FFC23D;
    --yellow-dark: #D99A12;
    --red: #FF5A5F;
    --blue: #3D7BF7;
    --shadow: rgba(31, 42, 68, .18);
    --font: "Baloo 2", "Trebuchet MS", Verdana, system-ui, sans-serif;
    --radius: 20px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #172036;
    --card: #223050;
    --ink: #F2F5FB;
    --muted: #A8B4CF;
    --off: #3A4868;
    --wire: #B48D6B;
    --shadow: rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.05rem;
    line-height: 1.4;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 760px; margin: 0 auto;
    padding: max(.75rem, env(safe-area-inset-top)) max(.7rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(.7rem, env(safe-area-inset-left));
  }
  [hidden] { display: none !important; }

  /* Logo: the two end words of the dictionary, at the two ends of a wire */
  .logo { display: flex; align-items: center; gap: .4rem; }
  /* big game title, on the name and menu screens */
  .logo.title { margin: .25rem 0 1rem; }
  .logo span { font-weight: 800; font-size: clamp(1rem, 5.4vw, 2.4rem); line-height: 1; padding: .35em .45em .25em; border-radius: 12px; color: #fff; }
  .logo .from { background: var(--green); }
  .logo .to { background: var(--purple); }
  .logo i { flex: 1; height: 5px; background: var(--wire); border-radius: 3px; position: relative; min-width: 1.5rem; }
  .logo i::before, .logo i::after { content: ""; position: absolute; top: 50%; width: clamp(8px, 2.6vw, 14px); height: clamp(8px, 2.6vw, 14px); border-radius: 50%; transform: translateY(-50%); }
  .logo i::before { left: 25%; background: var(--yellow); }
  .logo i::after { left: 55%; background: var(--red); }
  .logo.mini { margin: 0; }
  .logo.mini span { font-size: var(--t, 1rem); border-radius: 8px; }
  .logo.mini i { min-width: .9rem; }
  .logo.mini i::before, .logo.mini i::after { width: 9px; height: 9px; }

  h1, h2, h3 { font-weight: 800; line-height: 1.15; margin: 0 0 .5rem; }
  h1 { font-size: clamp(1.5rem, 6.5vw, 2.3rem); }
  h2 { font-size: clamp(1.3rem, 5.5vw, 1.8rem); }
  p { margin: 0 0 .9rem; max-width: 60ch; }
  .muted { color: var(--muted); }

  .panel { background: var(--card); border-radius: var(--radius); padding: 1rem; box-shadow: 0 5px 0 var(--shadow); }

  /* font-size ≥ 16px: avoids iOS auto-zoom when the field is tapped */
  input[type=text], input[type=password] {
    width: 100%; min-height: 3.25rem; font: inherit; font-size: 1.4rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em;
    padding: .4rem .8rem; border-radius: 14px; border: 4px solid var(--off);
    background: var(--bg); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--blue); }
  input::placeholder { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; font-size: 1.1rem; }

  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  .btn {
    min-height: 3.25rem; font-weight: 800; font-size: 1.15rem; border: 0; border-radius: 16px;
    padding: .55rem 1.1rem .45rem; color: #fff; background: var(--blue);
    box-shadow: 0 5px 0 #2456C0; transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2456C0; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.green { background: var(--green); box-shadow: 0 5px 0 var(--green-dark); }
  .btn.purple { background: var(--purple); box-shadow: 0 5px 0 var(--purple-dark); }
  .btn.yellow { background: var(--yellow); color: #3A2A00; box-shadow: 0 5px 0 var(--yellow-dark); }
  .btn.green:active { box-shadow: 0 1px 0 var(--green-dark); }
  .btn.purple:active { box-shadow: 0 1px 0 var(--purple-dark); }
  .btn.yellow:active { box-shadow: 0 1px 0 var(--yellow-dark); }
  .btn:disabled { box-shadow: none; }
  .link { min-height: 2.75rem; background: none; border: 0; color: var(--muted); font-weight: 700; text-decoration: underline; padding: .4rem .5rem; }
  :focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: .9rem; }
  .input-row { display: flex; gap: .5rem; }
  .input-row input { flex: 1; min-width: 0; }
  .input-row .btn { flex: none; }
  /* Mode 2 on phones: "Try" goes under the field, as wide as the hint button,
     so after typing it is the natural button to press */
  @media (max-width: 599px) { .guess-row { flex-direction: column; } .guess-row input { flex: none; } }

  /* Menu: one column on phones, two from tablets */
  .modes { display: grid; gap: .9rem; grid-template-columns: 1fr; grid-auto-rows: 1fr; margin: 1rem 0; }
  .mode {
    text-align: left; border: 0; border-radius: var(--radius); padding: 1rem 1.1rem; color: #fff;
    display: grid; grid-template-columns: auto 1fr; column-gap: .9rem; row-gap: .15rem; align-items: center;
    touch-action: manipulation;
  }
  .mode .emoji { font-size: 2.2rem; line-height: 1; grid-row: span 2; }
  .mode strong { font-size: 1.35rem; line-height: 1.1; }
  .mode span:not(.emoji) { font-size: 1rem; opacity: .95; }
  .mode.one { background: var(--green); box-shadow: 0 5px 0 var(--green-dark); }
  .mode.two { background: var(--purple); box-shadow: 0 5px 0 var(--purple-dark); }
  .mode:active { transform: translateY(4px); box-shadow: none; }
  /* "How to play": closed at first, with an arrow that shows it can be opened and closed again */
  .rules { margin-top: 1rem; }
  details summary { font-weight: 800; cursor: pointer; min-height: 2.75rem; display: flex; align-items: center; gap: .5rem; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after {
    content: ""; margin-left: auto; width: .6em; height: .6em; flex: none;
    border-right: .2em solid currentColor; border-bottom: .2em solid currentColor;
    transform: translateY(-.15em) rotate(45deg); transition: transform .2s;
  }
  details:not([open]) summary::after { transform: rotate(-45deg); }
  @media (prefers-reduced-motion: reduce) { details summary::after { transition: none; } }
  details ol { padding-left: 1.3rem; margin: .5rem 0 0; }
  details li { margin-bottom: .3rem; }

  /* Top bar */
  /* Header on three columns: Menu on the left, small logo in the middle, theme switch on the right.
     The side columns are equal, so the logo stays centred on the screen. */
  /* --t is the shared header size: the small logo and the switches all use it,
     so they always have the same height (1.6 times --t) at every width */
  .topbar { --t: clamp(.8rem, 3.4vw, 1.05rem); display: grid; grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr); align-items: center; gap: .5rem; min-height: 2.75rem; margin-bottom: .6rem; }
  .topbar .link { grid-column: 1; justify-self: start; padding-left: 0; }
  .topbar .logo { grid-column: 2; }
  /* phones: only the arrow of "⬅ Menu" is left, so the logo can be bigger and centred */
  @media (max-width: 339px) { .topbar { --t: .7rem; } }
  @media (max-width: 419px) { .topbar { gap: .3rem; } .topbar .menu-label { display: none; } .topbar .link { min-width: 2.75rem; font-size: 1.3rem; text-decoration: none; } }
  /* group of controls on the right: the theme today, more controls in the future */
  .controls { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: .6rem; }

  /* Sun/moon switch, sized in em on the same --t as the logo */
  .theme {
    font-size: var(--t, 1rem); flex: none; position: relative; width: 2.9em; height: 1.6em; padding: 0;
    border: 0; border-radius: 999px; background: #9ED3FF; box-shadow: 0 2px 0 rgba(31, 42, 68, .18);
  }
  /* fixed 64×44px touch area, bigger than the visible switch (it grows to the left so it never leaves the screen) */
  .theme::before { content: ""; position: absolute; right: -6px; top: 50%; width: 64px; height: 44px; transform: translateY(-50%); }
  .theme .knob {
    position: absolute; top: .18em; left: .18em; width: 1.24em; height: 1.24em; border-radius: 50%;
    display: grid; place-items: center; background: #fff; box-shadow: 0 .1em 0 rgba(0, 0, 0, .15);
    transition: transform .2s;
  }
  .theme svg { width: .9em; height: .9em; }
  .theme .sun { color: #FFB000; }
  .theme .moon { color: #FFE58A; display: none; }
  [data-theme="dark"] .theme {
    background: radial-gradient(circle at 18% 32%, #fff .07em, transparent .11em),
                radial-gradient(circle at 32% 70%, #fff .055em, transparent .09em),
                radial-gradient(circle at 45% 38%, #fff .05em, transparent .085em), #3A4A8C;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  }
  /* knob travel: width - knob - 2 margins = 2.9 - 1.24 - 0.36 */
  [data-theme="dark"] .theme .knob { transform: translateX(1.3em); background: #1B2440; }
  [data-theme="dark"] .theme .sun { display: none; }
  [data-theme="dark"] .theme .moon { display: block; }
  @media (prefers-reduced-motion: reduce) { .theme .knob { transition: none; } }

  /* Guesses */
  .guesses { display: flex; align-items: center; gap: .3rem .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
  /* phones: with more than 10 guesses the dots go on two equal rows (e.g. 10+10) */
  .dots { display: grid; grid-template-columns: repeat(var(--cols, 10), 12px); gap: 3px; }
  .dots b { width: 12px; height: 12px; border-radius: 50%; background: var(--off); }
  .dots b.used { background: var(--red); }
  .guesses small { font-weight: 700; color: var(--muted); font-size: .95rem; }

  /* The alphabet abacus: two rods on phones (A–M and N–Z), a single one from 600px */
  .abacus { --bead: min(22px, 5.6vw); --top: 1.15rem; display: flex; flex-direction: column; gap: .5rem; margin-bottom: .9rem; }
  /* --d is the actual bead diameter: at most --bead and never more than 80% of the column.
     Band, wire and beads all use --d, so they stay aligned at every width. */
  .rod { position: relative; padding-top: var(--top); }
  .rod .wire, .rod .band, .rod .colors, .rod b { --d: var(--bead); }
  @supports (width: 1cqw) {
    .rod { container-type: inline-size; }
    .rod .wire, .rod .band, .rod .colors, .rod b { --d: min(var(--bead), 100cqw / var(--n) * .8); }
  }
  .rod .wire { position: absolute; left: 0; right: 0; top: calc(var(--top) + 2px + var(--d) / 2 - 2px); height: 4px; background: var(--wire); border-radius: 2px; }
  /* The highlight band works as a mask: inside it there is a coloured copy of the beads,
     clipped by its edges. This way the boundary beads are only partly coloured. */
  .rod .band { position: absolute; top: calc(var(--top) - 3px); height: calc(var(--d) + 10px); background: rgba(255, 194, 61, .35); border-radius: 999px; }
  .rod .band.cont-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .rod .band.cont-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .rod .colors { position: absolute; left: 0; right: 0; top: calc(var(--top) - 3px); height: calc(var(--d) + 10px); padding-top: 5px; display: grid; }
  .rod .colors i { display: flex; justify-content: center; align-items: flex-start; }
  /* a bead never exceeds 80% of its column: there is always room between two beads */
  .rod .colors b { width: var(--d); aspect-ratio: 1; border-radius: 50%; }
  .rod .colors .c0 { background: var(--red); }
  .rod .colors .c1 { background: var(--yellow); }
  .rod .colors .c2 { background: var(--green); }
  .rod .colors .c3 { background: var(--blue); }
  .rod .colors .c4 { background: var(--purple); }
  .rod .beads { position: relative; display: grid; }
  .rod .bead { display: flex; flex-direction: column; align-items: center; gap: 9px; } /* 5px of band below the bead + 4px of breathing room */
  .rod .bead b { width: var(--d); aspect-ratio: 1; border-radius: 50%; background: var(--off); margin-top: 2px; }
  .rod .bead span { font-size: clamp(.75rem, 3.4vw, 1rem); font-weight: 800; color: var(--muted); padding: 0 3px; }
  .rod .bead.inside span { color: var(--ink); }
  .rod .bead.highlight span { color: #fff; background: var(--red); border-radius: 6px; }
  .rod .marker { position: absolute; top: 0; transform: translateX(-50%); font-size: 1rem; line-height: 1; color: var(--ink); }

  /* The three tiles: low bound, word in play, high bound.
     Long words shrink by themselves (see fitTiles) */
  .interval { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr) minmax(0, 1fr); gap: .35rem; align-items: stretch; margin-bottom: .9rem; }
  .tile { border-radius: 16px; padding: .5rem .25rem .4rem; color: #fff; text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .tile small { font-size: .8rem; font-weight: 700; opacity: .9; }
  .tile strong { display: block; font-size: 1.15rem; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  .tile strong.wrap { white-space: normal; overflow-wrap: anywhere; }
  .tile.low { background: var(--green); }
  .tile.high { background: var(--purple); }
  .tile.mid { background: var(--yellow); color: #3A2A00; }
  .tile.mid strong { font-size: 1.4rem; }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  .bubble { display: flex; gap: .6rem; align-items: center; margin-bottom: .8rem; }
  .bubble .face { font-size: 2.2rem; line-height: 1; }
  .bubble p { margin: 0; font-weight: 700; font-size: 1.2rem; }
  /* Phones: Before and After side by side, "That's it!" below at full width */
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .answers .btn { padding-inline: .3rem; font-size: 1.15rem; min-height: 3.6rem; }
  .answers .correct { grid-column: 1 / -1; order: 3; }
  .question { margin: .7rem 0 0; font-size: .95rem; }

  .message { min-height: 1.5em; font-weight: 700; margin: .7rem 0 0; }
  .message.error { color: var(--red); }

  .explain { margin-top: .9rem; border: 4px solid var(--red); border-radius: 16px; padding: .8rem; }
  .explain h3 { font-size: 1.15rem; margin-bottom: .3rem; }
  .explain p { margin-bottom: .6rem; }
  .alphabet { display: flex; flex-wrap: wrap; gap: 2px; }
  .alphabet span { width: 1.45rem; text-align: center; border-radius: 6px; font-weight: 800; color: var(--muted); }
  .alphabet span.on { background: var(--red); color: #fff; }

  .choices-title { font-weight: 800; margin: 1rem 0 .5rem; }
  .choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; max-width: 26rem; }
  .choices button { font-weight: 800; font-size: 1.25rem; min-height: 3rem; padding: .2rem 0 0; border-radius: 14px; border: 4px solid var(--off); background: var(--bg); color: var(--ink); }
  .choices button[aria-checked="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  #b-start { width: 100%; }

  /* Word group picker: big buttons to switch on and off */
  .groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin: .4rem 0 .6rem; }
  .group {
    display: flex; align-items: center; gap: .5rem; text-align: left; min-height: 3.4rem;
    padding: .45rem .6rem; border-radius: 14px; border: 4px solid var(--off);
    background: var(--bg); color: var(--ink); font-weight: 800; font-size: 1rem; line-height: 1.15;
  }
  .group .emoji { font-size: 1.5rem; line-height: 1; flex: none; }
  .group span:last-child { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
  @media (max-width: 359px) { .group { font-size: .9rem; gap: .35rem; padding-inline: .45rem; } .group .emoji { font-size: 1.25rem; } }
  .group .emoji { filter: grayscale(1); opacity: .55; }
  .group[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .group[aria-pressed="true"] .emoji { filter: none; opacity: 1; }
  .group-actions { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
  .group-actions .link { padding-left: 0; }
  #word-count { font-weight: 800; color: var(--muted); }
  #word-count.zero { color: var(--red); }
  #b-start2 { width: 100%; }
  @media (min-width: 600px) {
    .groups { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #b-start2 { width: auto; }
  }
  @media (min-width: 900px) { .groups { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  /* Row above the abacus: the common start of the possible words and, with the "?", the letter shown on the rods */
  /* on narrow phones the boxes move to the line below as a whole, instead of splitting */
  .zoom { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .5rem; font-weight: 700; color: var(--muted); font-size: .95rem; min-height: 2.3rem; padding: .1rem .5rem; margin: 0 -.5rem; border-radius: 12px; }
  .zoom .boxes { gap: 3px; flex-wrap: nowrap; }
  .zoom .boxes span { width: 1.6rem; height: 1.9rem; font-size: 1.05rem; border-radius: 8px; }
  .zoom .boxes span.here { border-color: var(--yellow); color: var(--ink); }
  .zoom.new { background: rgba(255, 194, 61, .35); color: var(--ink); }
  /* Discreet footer: version, code, licence and credits */
  /* items wrap whole, separated by space: no dot is left hanging at the end of a line */
  .footer { margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 1.1rem; font-size: .85rem; color: var(--muted); text-align: center; }
  .footer > * { white-space: nowrap; padding: .3rem 0; }
  .footer a { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .hints { margin-top: .9rem; border: 4px dashed var(--yellow); border-radius: 16px; padding: .7rem .8rem; }
  .hints ul { margin: 0 0 .5rem; padding-left: 1.2rem; font-weight: 700; }
  .boxes { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .boxes span { width: 1.9rem; height: 2.3rem; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; background: var(--bg); border: 3px solid var(--off); }
  .boxes span.filled { background: var(--red); border-color: var(--red); color: #fff; }
  .boxes span.gap { border: 0; background: none; width: auto; color: var(--muted); }
  #b-hint { flex: 1; }

  .history-title { margin: 1.2rem 0 0; font-size: 1.05rem; }
  .side.empty { display: none; }
  .history li.empty { background: none; border: 3px dashed var(--off); color: var(--muted); font-size: .95rem; }
  .history { list-style: none; margin: .4rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
  .history li { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; column-gap: .5rem; background: var(--bg); border-radius: 12px; padding: .3rem .7rem; }
  .history li strong { font-weight: 800; letter-spacing: .03em; }
  .history li em { font-style: normal; font-weight: 700; font-size: .9rem; }
  .history li.before em { color: var(--green-dark); }
  .history li.after em { color: var(--purple-dark); }
  [data-theme="dark"] .history li.before em { color: var(--green); }
  [data-theme="dark"] .history li.after em { color: #B394FF; }

  .end { text-align: center; }
  .end .big { font-size: 4.2rem; line-height: 1; margin-bottom: .5rem; }
  .end p { margin-inline: auto; }
  .end .row { flex-direction: column; align-items: stretch; }

  /* ===== Large phones and portrait tablets ===== */
  @media (min-width: 600px) {
    body { font-size: 1.15rem; }
    main { padding-inline: max(1.25rem, env(safe-area-inset-left)); padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .panel { padding: 1.5rem; border-radius: 24px; box-shadow: 0 6px 0 var(--shadow); }
    .logo.title { margin-bottom: 1.5rem; }
    .modes { grid-template-columns: 1fr 1fr; gap: 1rem; }
    .mode { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; padding: 1.4rem; min-height: 200px; }
    .mode .emoji { font-size: 2.6rem; }
    .mode strong { font-size: 1.6rem; }
    .abacus { --bead: min(26px, 3vw); --top: 1.4rem; margin-bottom: 1.25rem; }
    .dots { display: flex; flex-wrap: wrap; }
    .dots b { width: 14px; height: 14px; }
    .interval { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr); gap: .6rem; margin-bottom: 1.25rem; }
    .tile { padding: .7rem .6rem .5rem; border-radius: 18px; }
    .tile small { font-size: .9rem; }
    .tile strong { font-size: 1.7rem; }
    .tile.mid strong { font-size: 2rem; }
    .answers { grid-template-columns: 1fr auto 1fr; }
    .answers .correct { grid-column: auto; order: 0; padding-inline: 1.2rem; }
    .answers .btn { font-size: 1.25rem; }
    .boxes span { width: 2.2rem; height: 2.6rem; font-size: 1.4rem; }
    #b-hint { flex: none; }
    /* "Try" stays next to the field but is as wide as the hint button, so neither one wins the eye */
    #b-guess, #b-hint { min-width: 12rem; }
    #b-start { width: auto; }
    .end .big { font-size: 5rem; }
    .end .row { flex-direction: row; justify-content: center; }
  }

  /* ===== Landscape tablets and computers: the words tried move to the side ===== */
  @media (min-width: 900px) {
    body[data-screen="s-game"] main { max-width: 1040px; }
    .game { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 1.75rem; align-items: start; }
    .game .abacus { --bead: min(20px, 1.9vw); }
    .game .side { border-left: 3px solid var(--bg); padding-left: 1.5rem; }
    .game .history-title { margin-top: 0; }
    .game .side.empty { display: block; }
    .game .history { max-height: 60vh; overflow-y: auto; }
    .history li em { font-size: .85rem; }
  }

  /* Language switch: same shape as the theme switch, with the flags in the knob.
     It shows only on the name and menu screens, on the left of the header. */
  .lang {
    grid-column: 1; justify-self: start;
    font-size: var(--t, 1rem); position: relative; width: 2.9em; height: 1.6em; padding: 0;
    border: 0; border-radius: 999px; background: #BFD4EC; box-shadow: 0 2px 0 rgba(31, 42, 68, .18);
  }
  [data-theme="dark"] .lang { background: #3A4868; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .lang::before { content: ""; position: absolute; left: -6px; top: 50%; width: 64px; height: 44px; transform: translateY(-50%); }
  /* knob identical to the sun/moon one (same background, size and shadow), holding the round flag
     as big as the sun and the moon */
  .lang .knob {
    position: absolute; top: .18em; left: .18em; width: 1.24em; height: 1.24em; border-radius: 50%;
    display: grid; place-items: center; background: #fff; box-shadow: 0 .1em 0 rgba(0, 0, 0, .15);
    transition: transform .2s;
  }
  [data-theme="dark"] .lang .knob { background: #1B2440; }
  .lang .knob svg { display: block; width: .9em; height: .9em; border-radius: 50%; }
  .lang .knob .uk { display: none; }
  .lang[aria-checked="true"] .knob { transform: translateX(1.3em); }
  .lang[aria-checked="true"] .knob .it { display: none; }
  .lang[aria-checked="true"] .knob .uk { display: block; }
  @media (prefers-reduced-motion: reduce) { .lang .knob { transition: none; } }
</style>

<body>
<main>
  <header class="topbar" id="topbar">
    <button class="lang" id="b-lang" role="switch" aria-checked="false" aria-label="English">
      <span class="knob" aria-hidden="true">
        <svg class="it" viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>
        <svg class="uk" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>
      </span>
    </button>
    <button class="link" id="b-back" data-menu hidden data-t-aria="back">⬅<span class="menu-label"> Menu</span></button>
    <div class="logo mini" id="logo-mini" aria-hidden="true" hidden><span class="from"></span><i></i><span class="to"></span></div>
    <div class="controls">
      <button class="theme" id="b-theme" role="switch" aria-checked="false" data-t-aria="darkTheme">
        <span class="knob" aria-hidden="true">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><path d="M12 2.4v2.4M12 19.2v2.4M2.4 12h2.4M19.2 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M5.2 18.8l1.7-1.7M17.1 6.9l1.7-1.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z" fill="currentColor"/></svg>
        </span>
      </button>
    </div>
  </header>

  <!-- 1. Name -->
  <section id="s-name" class="screen">
    <div class="logo title" aria-hidden="true"><span class="from"></span><i></i><span class="to"></span></div>
    <div class="panel">
      <h1 data-t="nameTitle"></h1>
      <p class="muted" data-t="nameInfo"></p>
      <div class="input-row">
        <input id="in-name" type="text" enterkeyhint="go" maxlength="20" autocomplete="off" data-t-ph="namePh" data-t-aria="nameAria">
        <button class="btn green" id="b-name" data-t="play"></button>
      </div>
      <button class="link" id="b-surprise" data-t="surprise"></button>
    </div>
  </section>

  <!-- 2. Menu -->
  <section id="s-menu" class="screen" hidden>
    <div class="logo title" aria-hidden="true"><span class="from"></span><i></i><span class="to"></span></div>
    <h1 id="greeting"></h1>
    <p data-t="intro"></p>
    <details class="panel rules">
      <summary data-t="rulesTitle"></summary>
      <ol>
        <li data-t="rule1"></li>
        <li data-t="rule2"></li>
        <li data-t="rule3"></li>
        <li data-t="rule4"></li>
      </ol>
    </details>
    <div class="modes">
      <button class="mode one" id="b-mode1">
        <span class="emoji" aria-hidden="true">🤫</span>
        <strong data-t="mode1Title"></strong>
        <span data-t="mode1Text"></span>
      </button>
      <button class="mode two" id="b-mode2">
        <span class="emoji" aria-hidden="true">🔍</span>
        <strong data-t="mode2Title"></strong>
        <span data-t="mode2Text"></span>
      </button>
    </div>
    <button class="link" id="b-change-name" data-t="changeName"></button>
  </section>

  <!-- 3. Secret word (mode 1) -->
  <section id="s-secret" class="screen" hidden>
    <div class="panel">
      <h2 data-t="secretTitle"></h2>
      <p data-t="secretInfo"></p>
      <div class="input-row">
        <input id="in-secret" type="password" enterkeyhint="go" autocorrect="off" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" data-t-ph="secretPh" data-t-aria="secretPh">
        <button class="btn yellow" id="b-eye" aria-pressed="false"></button>
      </div>
      <p class="choices-title" data-t="howMany"></p>
      <div class="choices" id="guess-choices" role="radiogroup" data-t-aria="howManyAria"></div>
      <p class="message error" id="msg-secret" aria-live="polite"></p>
      <button class="btn green" id="b-start" data-t="start"></button>
    </div>
  </section>

  <!-- 3b. Word groups (mode 2) -->
  <section id="s-groups" class="screen" hidden>
    <div class="panel">
      <h2 data-t="groupsTitle"></h2>
      <p data-t="groupsInfo"></p>
      <div class="groups" id="groups"></div>
      <div class="group-actions">
        <button class="link" id="b-all"></button>
        <span id="word-count" aria-live="polite"></span>
      </div>
      <button class="btn green" id="b-start2" data-t="start"></button>
    </div>
  </section>

  <!-- 4. Game -->
  <section id="s-game" class="screen" hidden>
    <div class="panel game">
     <div class="board">
      <div class="guesses"><div class="dots" id="dots" aria-hidden="true"></div><small id="count"></small></div>

      <div class="abacus" id="abacus" role="img"></div>

      <div class="interval" id="interval">
        <div class="tile low"><small data-t="tAfter"></small><strong id="t-low"></strong></div>
        <div class="tile mid"><small id="t-mid-label"></small><strong id="t-mid">?</strong></div>
        <div class="tile high"><small data-t="tBefore"></small><strong id="t-high"></strong></div>
      </div>

      <!-- Mode 1: the computer guesses -->
      <div id="area-cpu" hidden>
        <div class="bubble"><span class="face" aria-hidden="true">🤖</span><p id="cpu-says" aria-live="polite"></p></div>
        <div class="answers">
          <button class="btn green" data-r="before" data-t="bBefore"></button>
          <button class="btn yellow correct" data-r="correct" data-t="bCorrect"></button>
          <button class="btn purple" data-r="after" data-t="bAfter"></button>
        </div>
        <p class="muted question" data-t="question"></p>
        <div class="explain" id="explain" hidden aria-live="polite">
          <h3 data-t="explainTitle"></h3>
          <p id="explain-text"></p>
          <div class="alphabet" id="explain-alphabet"></div>
        </div>
      </div>

      <!-- Mode 2: the child guesses -->
      <div id="area-child" hidden>
        <div class="input-row guess-row">
          <input id="in-guess" type="text" enterkeyhint="go" autocorrect="off" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" data-t-ph="guessPh" data-t-aria="guessAria">
          <button class="btn green" id="b-guess" data-t="guess"></button>
        </div>
        <p class="message" id="msg-guess" aria-live="polite"></p>
        <div class="hints" id="hints" hidden aria-live="polite">
          <ul id="hints-list"></ul>
          <div class="boxes" id="boxes" aria-hidden="true"></div>
        </div>
        <div class="row">
          <button class="btn yellow" id="b-hint"></button>
          <button class="link" id="b-give-up" hidden data-t="giveUp"></button>
        </div>
      </div>

     </div>
     <aside class="side" id="side">
      <h3 class="history-title" data-t="historyTitle"></h3>
      <ul class="history" id="history"></ul>
     </aside>
    </div>
  </section>

  <!-- 5. End -->
  <section id="s-end" class="screen end" hidden>
    <div class="panel">
      <div class="big" id="end-emoji" aria-hidden="true"></div>
      <h1 id="end-title"></h1>
      <p id="end-text"></p>
      <div class="row">
        <button class="btn green" id="b-again" data-t="again"></button>
        <button class="btn purple" data-menu data-t="changeGame"></button>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer">
    <span id="version"></span>
    <a href="https://github.com/vcutrona/abaco-zuzzurellone-kids" target="_blank" rel="noopener" data-t="footerCode"></a>
    <a href="https://github.com/vcutrona/abaco-zuzzurellone-kids/blob/main/LICENSE" target="_blank" rel="noopener" data-t="footerLicense"></a>
    <span data-t="footerClaude"></span>
    <a href="https://it.wikipedia.org/wiki/Abaco_zuzzurellone" target="_blank" rel="noopener" data-t="footerWiki"></a>
  </footer>
</main>

/* ===== Utilities ===== */
const $ = id => document.getElementById(id);
const norm = s => s.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const U = s => s.toUpperCase();
const random = n => Math.floor(Math.random() * n);

// Initial language: the first supported language in the browser's preference list
// (e.g. German, then Italian → Italian). If none is supported, English.
function initialLanguage() {
  const preferred = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
  for (const l of preferred) {
    const code = l.toLowerCase().slice(0, 2);
    if (code in LANGUAGES) return code;
  }
  return "en";
}
let lang = initialLanguage();
let L, START, END, DICT, CATEGORY_HINT;
const t = (key, ...args) => {
  const v = TEXTS[lang][key];
  return typeof v === "function" ? v(...args) : v;
};
// shared parameters of the fixed texts: dictionary ends and example word, in uppercase
const ends = () => [U(START), U(END), U(L.example)];

// Words of the selected groups, in the current language
function wordsInPlay() {
  return [...new Set(L.categories.filter(c => state.groups.has(c.group)).flatMap(c => c.words).map(norm))].sort(cmp);
}

function loadWords() {
  L = LANGUAGES[lang];
  START = L.start;
  END = L.end;
  DICT = [...new Set(L.categories.flatMap(c => c.words).map(norm))].sort(cmp);
  CATEGORY_HINT = new Map();
  L.categories.forEach(c => c.words.forEach(w => CATEGORY_HINT.set(norm(w), c.hint)));
}

const state = {
  name: "", funny: null, mode: 0, secret: "", low: "", high: "",
  history: [], guess: null, waiting: false, hints: 0, freeHints: 0, prevLevel: 0, cpuDict: [], maxCpu: MAX_CPU_GUESSES,
  groups: new Set(GROUPS.map(g => g.id)) // at first every group is selected
};
const maxGuesses = () => (state.mode === 1 ? state.maxCpu : MAX_CHILD_GUESSES);

// The surprise name is stored as a pair of positions, so it gets translated when the language changes
function displayName() {
  if (!state.funny) return state.name;
  const [i, j] = state.funny;
  return L.makeName(L.funnyNames[i], L.funnyAdjectives[j], L.genders[i]);
}
const withName = s => (displayName() ? `${s}, ${displayName()}!` : `${s}!`);

function applyTexts() {
  document.documentElement.lang = lang;
  const [A, Z, X] = ends();
  document.title = t("pageTitle", A, Z);
  document.querySelectorAll(".logo .from").forEach(e => (e.textContent = A));
  document.querySelectorAll(".logo .to").forEach(e => (e.textContent = Z));
  document.querySelectorAll("[data-t]").forEach(e => (e.textContent = t(e.dataset.t, A, Z, X)));
  document.querySelectorAll("[data-t-ph]").forEach(e => (e.placeholder = t(e.dataset.tPh)));
  document.querySelectorAll("[data-t-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.tAria)));
  $("b-lang").setAttribute("aria-checked", String(lang === "en"));
  $("b-lang").title = t("langTitle");
  if (displayName()) $("greeting").textContent = t("greeting", displayName());
  drawGroups();
  applyTheme(document.documentElement.dataset.theme);
}

$("b-lang").onclick = () => {
  lang = lang === "it" ? "en" : "it";
  loadWords();
  applyTexts();
};

// Choice of the computer's guesses
function drawChoices() {
  $("guess-choices").innerHTML = CPU_GUESS_OPTIONS.map(n =>
    `<button role="radio" aria-checked="${n === state.maxCpu}" data-n="${n}">${n}</button>`).join("");
  $("guess-choices").querySelectorAll("button").forEach(b => (b.onclick = () => {
    state.maxCpu = Number(b.dataset.n);
    drawChoices();
    $("guess-choices").querySelector(`[data-n="${b.dataset.n}"]`).focus();
  }));
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => (s.hidden = s.id !== id));
  document.body.dataset.screen = id;
  const inGame = id === "s-secret" || id === "s-groups" || id === "s-game";
  $("b-back").hidden = !inGame;
  $("logo-mini").hidden = !(inGame || id === "s-end");
  // the language can only be chosen before starting to play
  $("b-lang").hidden = !(id === "s-name" || id === "s-menu");
  // the footer only shows on the start screens, not during the game
  $("footer").hidden = !(id === "s-name" || id === "s-menu");
  window.scrollTo(0, 0);
}

/* ===== Name and menu ===== */
function saveName(name) {
  const n = name.trim();
  state.name = n ? n.charAt(0).toUpperCase() + n.slice(1) : "";
  state.funny = n ? null : [random(L.funnyNames.length), random(L.funnyAdjectives.length)];
  $("greeting").textContent = t("greeting", displayName());
  show("s-menu");
}
$("b-name").onclick = () => saveName($("in-name").value);
$("in-name").addEventListener("keydown", e => { if (e.key === "Enter") saveName($("in-name").value); });
$("b-surprise").onclick = () => saveName("");
$("b-change-name").onclick = () => { show("s-name"); $("in-name").focus(); };
document.querySelectorAll("[data-menu]").forEach(b => (b.onclick = () => show("s-menu")));
$("b-mode1").onclick = () => startMode1();
$("b-mode2").onclick = () => { drawGroups(); show("s-groups"); };
$("b-again").onclick = () => (state.mode === 1 ? startMode1() : startMode2());

/* ===== Shared game logic ===== */
function newGame(mode) {
  Object.assign(state, { mode, low: START, high: END, history: [], guess: null, waiting: false, hints: 0, freeHints: 0, prevLevel: 0 });
  $("area-cpu").hidden = mode !== 1;
  $("area-child").hidden = mode !== 2;
  $("explain").hidden = true;
  $("msg-guess").textContent = "";
  drawHints();
}

// Position of a word on the abacus, from 0 (A) to 26 (end of Z)
function position(w) {
  let p = w.charCodeAt(0) - 97, d = 1;
  for (let k = 1; k < Math.min(w.length, 6); k++) { d *= 27; p += (w.charCodeAt(k) - 96) / d; }
  return Math.min(25.999, p);
}

function draw(highlight = hintLetters(), highlightLevel = 0) {
  // guess dots
  const used = state.history.length;
  const total = maxGuesses();
  $("dots").style.setProperty("--cols", total > 10 ? Math.ceil(total / 2) : total);
  $("dots").innerHTML = Array.from({ length: total }, (_, i) => `<b class="${i < used ? "used" : ""}"></b>`).join("");
  $("count").textContent = t("count", total - used);

  drawAbacus(highlight, highlightLevel);

  // tiles
  $("t-low").textContent = U(state.low);
  $("t-high").textContent = U(state.high);
  fitTiles();

  // words tried (most recent on top)
  $("side").classList.toggle("empty", used === 0);
  $("history").innerHTML = used === 0
    ? `<li class="empty">${t("historyEmpty")}</li>`
    : state.history.slice().reverse().map(h =>
      `<li class="${h.dir}"><strong>${U(h.word)}</strong><em>${t(h.dir === "before" ? "historyBefore" : "historyAfter")}</em></li>`
    ).join("");
}

// On phones the abacus has two rods (A–M and N–Z), from 600px up a single one
const narrowScreen = window.matchMedia("(max-width: 599px)");
function drawAbacus(highlight, highlightLevel) {
  const rods = narrowScreen.matches ? 2 : 1;
  const perRod = 26 / rods;
  // Zoom: if the two bounds start with the same letters, the abacus shows the next letter.
  // Every word between the two bounds necessarily has the same start, so only the rest matters.
  const k = commonPrefix(state.low, state.high);
  const prefix = state.high.slice(0, k);
  const pos = w => (w.length ? position(w) : 0);
  // the dictionary ends count as the start of A and the end of Z
  const pl = k === 0 && state.low === START ? 0 : pos(state.low.slice(k));
  const ph = k === 0 && state.high === END ? 26 : pos(state.high.slice(k));
  const pg = state.guess && state.guess.startsWith(prefix) ? pos(state.guess.slice(k)) : null;
  // letters are highlighted only if they concern the position the abacus is showing
  if (highlightLevel !== k) highlight = [];
  // the row above the abacus stays lit until the next guess changes the bounds
  const newLevel = k > state.prevLevel;
  let html = "";
  for (let r = 0; r < rods; r++) {
    const from = r * perRod, to = from + perRod;
    const lo = Math.max(pl, from), hi = Math.min(ph, to);
    const letters = ALPHABET.slice(from, to);
    const grid = `grid-template-columns:repeat(${perRod},minmax(0,1fr))`;
    // highlight band with the coloured beads inside, aligned with the grey ones below
    let band = "";
    if (hi > lo) {
      const left = (lo - from) / perRod * 100, right = (hi - from) / perRod * 100;
      // on phones, where the band continues on the other rod, the edge stays straight
      const contLeft = r > 0 && lo === from, contRight = r < rods - 1 && hi === to;
      // at the ends of the alphabet the band overhangs by a few pixels, so the curve doesn't cut A and Z
      const extLeft = lo === 0 ? 6 : 0, extRight = hi === 26 ? 6 : 0;
      const cls = ["band", contLeft ? "cont-left" : "", contRight ? "cont-right" : ""].join(" ");
      band = `<div class="${cls}" style="left:calc(${left}% - ${extLeft}px);width:calc(${right - left}% + ${extLeft + extRight}px)"></div>`;
      // the coloured beads are clipped with the same shape as the band
      const leftR = contLeft ? "0" : "999px", rightR = contRight ? "0" : "999px";
      const clip = `inset(0 calc(${100 - right}% - ${extRight}px) 0 calc(${left}% - ${extLeft}px) round ${leftR} ${rightR} ${rightR} ${leftR})`;
      const colors = letters.map((l, j) => `<i><b class="c${(from + j) % 5}"></b></i>`).join("");
      band += `<div class="colors" style="${grid};clip-path:${clip};-webkit-clip-path:${clip}">${colors}</div>`;
    }
    const marker = pg !== null && pg >= from && pg < to
      ? `<div class="marker" style="left:${(pg - from) / perRod * 100}%">▼</div>` : "";
    const beads = letters.map((l, j) => {
      const i = from + j;
      const inside = i + 1 > pl && i < ph;
      const cls = ["bead", inside ? "inside" : "", highlight.includes(l) ? "highlight" : ""].join(" ");
      return `<div class="${cls}"><b></b><span>${U(l)}</span></div>`;
    }).join("");
    html += `<div class="rod" style="--n:${perRod}"><div class="wire"></div><div class="beads" style="${grid}">${beads}</div>${band}${marker}</div>`;
  }
  const boxes = [...prefix].map(c => `<span class="filled">${U(c)}</span>`).join("") + `<span class="here">?</span>`;
  $("abacus").innerHTML = `<div class="zoom${newLevel ? " new" : ""}"><span>${t("zoomStart")}</span><span class="boxes">${boxes}</span></div>` + html;
  $("abacus").setAttribute("aria-label", t("zoomAria", k + 1, U(prefix)));
}

// Shrinks long words (e.g. ZUZZURELLONE) until they fit in the tile
function fitTiles() {
  document.querySelectorAll(".tile strong").forEach(el => {
    el.style.fontSize = "";
    el.classList.remove("wrap");
    let size = parseFloat(getComputedStyle(el).fontSize) || 16;
    while (el.scrollWidth > el.clientWidth && size > 11) {
      size -= 1;
      el.style.fontSize = size + "px";
    }
    if (el.scrollWidth > el.clientWidth) el.classList.add("wrap");
  });
}

function redrawIfPlaying() { if (!$("s-game").hidden) draw(); }
narrowScreen.addEventListener("change", redrawIfPlaying);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitTiles, 120); });

// With mouse and keyboard the field stays focused after each guess; on touch the keyboard
// closes, so the child sees the updated abacus and tiles
const finePointer = window.matchMedia("(pointer: fine)");
function focusField(afterGuess) {
  if (finePointer.matches) $("in-guess").focus();
  else if (afterGuess) $("in-guess").blur();
}
// On phones, when the keyboard opens, keep the tiles and the field in view
$("in-guess").addEventListener("focus", () => {
  if (finePointer.matches) return;
  setTimeout(() => $("interval").scrollIntoView({ block: "start", behavior: "smooth" }), 300);
});

// How many leading letters two words have in common
function commonPrefix(a, b) {
  let k = 0;
  while (k < a.length && k < b.length && a[k] === b[k]) k++;
  return k;
}

function record(word, dir) {
  state.prevLevel = commonPrefix(state.low, state.high);
  state.history.push({ word, dir });
  if (dir === "before") state.high = word; else state.low = word;
}

function endGame(emoji, title, text) {
  $("end-emoji").textContent = emoji;
  $("end-title").textContent = title;
  $("end-text").textContent = text;
  show("s-end");
}

/* ===== Mode 1: you think, the computer guesses ===== */
function startMode1() {
  newGame(1);
  $("in-secret").value = "";
  $("in-secret").type = "password";
  $("b-eye").textContent = t("show");
  $("b-eye").setAttribute("aria-pressed", "false");
  $("msg-secret").textContent = "";
  drawChoices();
  show("s-secret");
  if (finePointer.matches) $("in-secret").focus();
}

$("b-eye").onclick = () => {
  const hidden = $("in-secret").type === "password";
  $("in-secret").type = hidden ? "text" : "password";
  $("b-eye").textContent = t(hidden ? "hide" : "show");
  $("b-eye").setAttribute("aria-pressed", String(hidden));
};

function confirmSecret() {
  const p = norm($("in-secret").value);
  const err = $("msg-secret");
  if (!p) return (err.textContent = t("errEmpty"));
  if (!/^[a-z]+$/.test(p)) return (err.textContent = t("errLetters"));
  if (!(cmp(p, START) > 0 && cmp(p, END) < 0)) return (err.textContent = t("errOutside", U(START), U(END)));
  state.secret = p;
  // the computer only knows a small set of words, different in every game
  state.cpuDict = DICT.slice().sort(() => Math.random() - 0.5).slice(0, CPU_WORDS).sort(cmp);
  show("s-game");
  cpuTurn();
}
$("b-start").onclick = confirmSecret;
$("in-secret").addEventListener("keydown", e => { if (e.key === "Enter") confirmSecret(); });

function cpuTurn() {
  $("explain").hidden = true;
  if (state.history.length >= state.maxCpu) {
    return endGame("🏆", withName(t("youWin")), t("endCpuOutOfGuesses", state.maxCpu, U(state.secret)));
  }
  const candidates = state.cpuDict.filter(w => cmp(w, state.low) > 0 && cmp(w, state.high) < 0);
  if (!candidates.length) {
    return endGame("🏆", withName(t("youWin")), t("endCpuNoWords", U(state.low), U(state.high), U(state.secret)));
  }
  // middle of the interval, plus a bit of noise
  const mid = (candidates.length - 1) / 2;
  const shift = (Math.random() * 2 - 1) * candidates.length * NOISE;
  const i = Math.max(0, Math.min(candidates.length - 1, Math.round(mid + shift)));

  state.guess = null;
  state.waiting = true;
  cpuButtons(false);
  $("cpu-says").textContent = t("cpuThinks");
  $("t-mid-label").textContent = t("tCpu");
  $("t-mid").textContent = "…";
  draw();

  setTimeout(() => {
    state.guess = candidates[i];
    state.waiting = false;
    $("cpu-says").textContent = t("cpuAsks", U(state.guess));
    const el = $("t-mid");
    el.textContent = U(state.guess);
    el.parentElement.classList.remove("pop"); void el.offsetWidth; el.parentElement.classList.add("pop");
    cpuButtons(true);
    draw();
  }, 650);
}

function cpuButtons(enabled) {
  document.querySelectorAll("#area-cpu [data-r]").forEach(b => (b.disabled = !enabled));
}
document.querySelectorAll("#area-cpu [data-r]").forEach(b => (b.onclick = () => answer(b.dataset.r)));

function answer(r) {
  if (state.waiting || !state.guess) return;
  const g = state.guess;
  const c = cmp(state.secret, g);
  const truth = c < 0 ? "before" : c > 0 ? "after" : "correct";

  if (r !== truth) return showExplanation(g, truth);

  if (truth === "correct") {
    return endGame("🤖", t("endCpuWins"), t("endCpuWinsText", U(g), state.history.length + 1, state.maxCpu));
  }
  record(g, truth);
  cpuTurn();
}

function showExplanation(g, truth) {
  let text, letters = [], level = 0;
  if (truth === "correct") {
    text = t("explainCorrect", U(g));
  } else {
    const e = explain(state.secret, g);
    text = e.text;
    letters = e.letters;
    level = e.level;
  }
  $("explain-text").innerHTML = text;
  $("explain-alphabet").innerHTML = letters.length
    ? ALPHABET.map(l => `<span class="${letters.includes(l) ? "on" : ""}">${U(l)}</span>`).join("")
    : "";
  $("explain").hidden = false;
  draw(letters, level);
}

// Explains in words why "a" comes before or after "b"
function explain(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  const A = U(a), B = U(b);
  let text = t("exYours", A);
  if (i === 1) text += t("exOne", U(a[0]));
  if (i > 1) text += t("exMany", i, U(a.slice(0, i)));
  let letters = [], level = 0;
  if (i === a.length || i === b.length) {
    text += t("exShorter", a.length < b.length ? A : B);
  } else {
    const la = a[i], lb = b[i];
    const [x, y] = la < lb ? [la, lb] : [lb, la];
    text += t("exLetter", i + 1, A, U(la), B, U(lb), U(x), U(y));
    letters = [la, lb];
  }
  level = i;
  text += t("exSo", A, cmp(a, b) < 0, B);
  return { text, letters, level };
}

/* ===== Mode 2: the computer thinks, you guess ===== */
function startMode2() {
  newGame(2);
  const words = wordsInPlay();
  state.secret = words[random(words.length)];
  // if all the words in play belong to the same category, the first hint (the category) is already known: it's given for free
  const categories = new Set(words.map(w => CATEGORY_HINT.get(w)));
  state.freeHints = categories.size === 1 ? 1 : 0;
  state.hints = state.freeHints;
  $("t-mid-label").textContent = t("tSecret");
  $("t-mid").textContent = "?";
  $("in-guess").value = "";
  drawHints();
  show("s-game");
  draw();
  focusField(false);
}

function drawGroups() {
  $("groups").innerHTML = GROUPS.map(g =>
    `<button class="group" data-g="${g.id}" aria-pressed="${state.groups.has(g.id)}"><span class="emoji" aria-hidden="true">${g.emoji}</span><span>${g[lang]}</span></button>`
  ).join("");
  $("groups").querySelectorAll(".group").forEach(b => (b.onclick = () => {
    const id = b.dataset.g;
    if (state.groups.has(id)) state.groups.delete(id); else state.groups.add(id);
    drawGroups();
    $("groups").querySelector(`[data-g="${id}"]`).focus();
  }));
  const all = state.groups.size === GROUPS.length;
  $("b-all").textContent = t(all ? "none" : "all");
  const n = wordsInPlay().length;
  $("word-count").textContent = t("wordCount", n);
  $("word-count").classList.toggle("zero", n === 0);
  $("b-start2").disabled = n === 0;
}
$("b-all").onclick = () => {
  state.groups = state.groups.size === GROUPS.length ? new Set() : new Set(GROUPS.map(g => g.id));
  drawGroups();
};
$("b-start2").onclick = () => startMode2();

function notify(text, error = false) {
  const m = $("msg-guess");
  m.textContent = text;
  m.classList.toggle("error", error);
}

function tryGuess() {
  const p = norm($("in-guess").value);
  if (!p) return notify(t("errEmptyGuess"), true);
  if (!/^[a-z]+$/.test(p)) return notify(t("errLetters"), true);
  if (state.history.some(h => h.word === p)) return notify(t("errAlready", U(p)), true);
  if (!(cmp(p, state.low) > 0 && cmp(p, state.high) < 0)) {
    return notify(t("errOutside", U(state.low), U(state.high)), true);
  }
  $("in-guess").value = "";
  const c = cmp(state.secret, p);
  if (c === 0) {
    return endGame("🎉", withName(t("found")), t("foundText", U(p), state.history.length + 1, MAX_CHILD_GUESSES));
  }
  record(p, c < 0 ? "before" : "after");
  if (state.history.length >= MAX_CHILD_GUESSES) {
    return endGame("🙈", t("outOfGuesses"), t("outOfGuessesText", U(state.secret)));
  }
  notify(t(c < 0 ? "msgBefore" : "msgAfter", U(p)));
  draw();
  focusField(true);
}
$("b-guess").onclick = tryGuess;
$("in-guess").addEventListener("keydown", e => { if (e.key === "Enter") tryGuess(); });

// Incremental hints, in this order: 1) category, 2) first letter, 3) last letter, 4) length
function hintLetters() {
  if (state.mode !== 2) return [];
  const s = state.secret, l = [];
  if (state.hints >= 2) l.push(s[0]);
  if (state.hints >= 3) l.push(s[s.length - 1]);
  return l;
}

function drawHints() {
  const s = state.secret, n = state.hints;
  $("hints").hidden = n === 0;
  const lines = [];
  if (n >= 1) lines.push(CATEGORY_HINT.get(s) || t("hintSimple"));
  if (n >= 2) lines.push(t("hintFirst", U(s[0])));
  if (n >= 3) lines.push(t("hintLast", U(s[s.length - 1])));
  if (n >= 4) lines.push(t("hintLength", s.length));
  $("hints-list").innerHTML = lines.map(f => `<li>${f}</li>`).join("");

  let boxes = "";
  if (n >= 4) {
    boxes = [...s].map((c, i) => (i === 0 || i === s.length - 1)
      ? `<span class="filled">${U(c)}</span>` : "<span></span>").join("");
  } else if (n >= 2) {
    boxes = `<span class="filled">${U(s[0])}</span><span class="gap">…</span>` +
      (n >= 3 ? `<span class="filled">${U(s[s.length - 1])}</span>` : "");
  }
  $("boxes").innerHTML = boxes;

  $("b-hint").hidden = n >= NUM_HINTS;
  // free hints don't count: with the category already known the button says "Hint 1 of 3"
  const g = state.freeHints;
  $("b-hint").textContent = t("hintButton", n + 1 - g, NUM_HINTS - g);
  $("b-give-up").hidden = n < NUM_HINTS;
}

$("b-hint").onclick = () => {
  if (state.hints >= NUM_HINTS) return;
  state.hints++;
  drawHints();
  draw();
};
$("b-give-up").onclick = () => endGame("🏳️", t("gaveUp"), t("gaveUpText", U(state.secret)));

/* ===== Light/dark theme ===== */
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");
let themeChosen = false; // until the child touches the switch, the game follows the device
function applyTheme(theme) {
  const dark = theme === "dark";
  document.documentElement.dataset.theme = theme;
  $("b-theme").setAttribute("aria-checked", String(dark));
  $("b-theme").title = t(dark ? "toLightTitle" : "toDarkTitle");
  document.querySelector('meta[name="theme-color"]').content = dark ? "#172036" : "#E3F2FF";
}
$("b-theme").onclick = () => {
  themeChosen = true;
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
};
systemDark.addEventListener("change", e => { if (!themeChosen) applyTheme(e.matches ? "dark" : "light"); });

/* ===== Startup ===== */
$("version").textContent = "v" + VERSION;
loadWords();
applyTexts();
show("s-name");
if (finePointer.matches) $("in-name").focus();
</script>
</body>
</html>
