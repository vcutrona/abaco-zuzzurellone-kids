<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E3F2FF">
<script>
  // Tema iniziale: segue quello del dispositivo. Impostato subito per evitare il lampo di colore.
  document.documentElement.dataset.tema = matchMedia("(prefers-color-scheme: dark)").matches ? "scuro" : "chiaro";
</script>
<title>Abaco… Zuzzurellone!</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cline x1='5' y1='32' x2='59' y2='32' stroke='%238A6A4F' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='32' r='9.5' fill='%23FFC23D'/%3E%3Ccircle cx='44' cy='32' r='9.5' fill='%23FF5A5F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Stile mobile-first: le regole base valgono per lo smartphone,
     i blocchi @media (min-width) aggiungono spazio per tablet e computer ===== */
  :root {
    color-scheme: light;
    --sfondo: #E3F2FF;
    --carta: #FFFFFF;
    --inchiostro: #1F2A44;
    --tenue: #5B6785;
    --spento: #C9D3E3;
    --filo: #8A6A4F;
    --verde: #12B5A5;
    --verde-scuro: #0B8478;
    --viola: #8E5CF6;
    --viola-scuro: #6A3FD0;
    --giallo: #FFC23D;
    --giallo-scuro: #D99A12;
    --rosso: #FF5A5F;
    --blu: #3D7BF7;
    --ombra: rgba(31, 42, 68, .18);
    --font: "Baloo 2", "Trebuchet MS", Verdana, system-ui, sans-serif;
    --raggio: 20px;
  }
  :root[data-tema="scuro"] {
    color-scheme: dark;
    --sfondo: #172036;
    --carta: #223050;
    --inchiostro: #F2F5FB;
    --tenue: #A8B4CF;
    --spento: #3A4868;
    --filo: #B48D6B;
    --ombra: rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    background: var(--sfondo);
    color: var(--inchiostro);
    font-family: var(--font);
    font-size: 1.05rem;
    line-height: 1.4;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 760px; margin: 0 auto;
    padding: max(.75rem, env(safe-area-inset-top)) max(.7rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(.7rem, env(safe-area-inset-left));
  }
  [hidden] { display: none !important; }

  /* Logo: le due parole estreme del dizionario, agli estremi di un filo */
  .logo { display: flex; align-items: center; gap: .4rem; }
  /* titolo grande del gioco, nelle schermate del nome e del menu */
  .logo.titolo { margin: .25rem 0 1rem; }
  .logo span { font-weight: 800; font-size: clamp(1rem, 5.4vw, 2.4rem); line-height: 1; padding: .35em .45em .25em; border-radius: 12px; color: #fff; }
  .logo .da { background: var(--verde); }
  .logo .a { background: var(--viola); }
  .logo i { flex: 1; height: 5px; background: var(--filo); border-radius: 3px; position: relative; min-width: 1.5rem; }
  .logo i::before, .logo i::after { content: ""; position: absolute; top: 50%; width: clamp(8px, 2.6vw, 14px); height: clamp(8px, 2.6vw, 14px); border-radius: 50%; transform: translateY(-50%); }
  .logo i::before { left: 25%; background: var(--giallo); }
  .logo i::after { left: 55%; background: var(--rosso); }
  .logo.piccolo { margin: 0; }
  .logo.piccolo span { font-size: var(--t, 1rem); border-radius: 8px; }
  .logo.piccolo i { min-width: .9rem; }
  .logo.piccolo i::before, .logo.piccolo i::after { width: 9px; height: 9px; }

  h1, h2, h3 { font-weight: 800; line-height: 1.15; margin: 0 0 .5rem; }
  h1 { font-size: clamp(1.5rem, 6.5vw, 2.3rem); }
  h2 { font-size: clamp(1.3rem, 5.5vw, 1.8rem); }
  p { margin: 0 0 .9rem; max-width: 60ch; }
  .tenue { color: var(--tenue); }

  .pannello { background: var(--carta); border-radius: var(--raggio); padding: 1rem; box-shadow: 0 5px 0 var(--ombra); }

  /* font-size ≥ 16px: evita lo zoom automatico di iOS quando si tocca il campo */
  input[type=text], input[type=password] {
    width: 100%; min-height: 3.25rem; font: inherit; font-size: 1.4rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em;
    padding: .4rem .8rem; border-radius: 14px; border: 4px solid var(--spento);
    background: var(--sfondo); color: var(--inchiostro);
  }
  input:focus { outline: none; border-color: var(--blu); }
  input::placeholder { text-transform: none; letter-spacing: 0; color: var(--tenue); font-weight: 500; font-size: 1.1rem; }

  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  .btn {
    min-height: 3.25rem; font-weight: 800; font-size: 1.15rem; border: 0; border-radius: 16px;
    padding: .55rem 1.1rem .45rem; color: #fff; background: var(--blu);
    box-shadow: 0 5px 0 #2456C0; transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2456C0; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.verde { background: var(--verde); box-shadow: 0 5px 0 var(--verde-scuro); }
  .btn.viola { background: var(--viola); box-shadow: 0 5px 0 var(--viola-scuro); }
  .btn.giallo { background: var(--giallo); color: #3A2A00; box-shadow: 0 5px 0 var(--giallo-scuro); }
  .btn.verde:active { box-shadow: 0 1px 0 var(--verde-scuro); }
  .btn.viola:active { box-shadow: 0 1px 0 var(--viola-scuro); }
  .btn.giallo:active { box-shadow: 0 1px 0 var(--giallo-scuro); }
  .btn:disabled { box-shadow: none; }
  .link { min-height: 2.75rem; background: none; border: 0; color: var(--tenue); font-weight: 700; text-decoration: underline; padding: .4rem .5rem; }
  :focus-visible { outline: 4px solid var(--blu); outline-offset: 3px; }

  .riga { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: .9rem; }
  .riga-input { display: flex; gap: .5rem; }
  .riga-input input { flex: 1; min-width: 0; }
  .riga-input .btn { flex: none; }

  /* Menu: una colonna sul telefono, due dal tablet */
  .modi { display: grid; gap: .9rem; grid-template-columns: 1fr; grid-auto-rows: 1fr; margin: 1rem 0; }
  .modo {
    text-align: left; border: 0; border-radius: var(--raggio); padding: 1rem 1.1rem; color: #fff;
    display: grid; grid-template-columns: auto 1fr; column-gap: .9rem; row-gap: .15rem; align-items: center;
    touch-action: manipulation;
  }
  .modo .emoji { font-size: 2.2rem; line-height: 1; grid-row: span 2; }
  .modo strong { font-size: 1.35rem; line-height: 1.1; }
  .modo span:not(.emoji) { font-size: 1rem; opacity: .95; }
  .modo.uno { background: var(--verde); box-shadow: 0 5px 0 var(--verde-scuro); }
  .modo.due { background: var(--viola); box-shadow: 0 5px 0 var(--viola-scuro); }
  .modo:active { transform: translateY(4px); box-shadow: none; }
  /* «Come si gioca»: aperto all'inizio, con una freccia che fa capire che si può chiudere e riaprire */
  .regole { margin-top: 1rem; }
  details summary { font-weight: 800; cursor: pointer; min-height: 2.75rem; display: flex; align-items: center; gap: .5rem; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after {
    content: ""; margin-left: auto; width: .6em; height: .6em; flex: none;
    border-right: .2em solid currentColor; border-bottom: .2em solid currentColor;
    transform: translateY(-.15em) rotate(45deg); transition: transform .2s;
  }
  details:not([open]) summary::after { transform: rotate(-45deg); }
  @media (prefers-reduced-motion: reduce) { details summary::after { transition: none; } }
  details ol { padding-left: 1.3rem; margin: .5rem 0 0; }
  details li { margin-bottom: .3rem; }

  /* Barra superiore di gioco */
  /* Testata su tre colonne: Menu a sinistra, logo piccolo al centro, interruttore del tema a destra.
     Le colonne laterali sono uguali, così il logo resta centrato sullo schermo. */
  /* --t è la misura comune della testata: logo piccolo e interruttore la usano entrambi,
     così hanno sempre la stessa altezza (1.6 volte --t) a ogni larghezza */
  .testata { --t: clamp(.8rem, 3.4vw, 1.05rem); display: grid; grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr); align-items: center; gap: .5rem; min-height: 2.75rem; margin-bottom: .6rem; }
  .testata .link { grid-column: 1; justify-self: start; padding-left: 0; }
  .testata .logo { grid-column: 2; }
  /* telefoni: di «⬅ Menu» resta solo la freccia, così il logo può essere più grande e centrato */
  @media (max-width: 339px) { .testata { --t: .7rem; } }
  @media (max-width: 419px) { .testata { gap: .3rem; } .testata .testo-menu { display: none; } .testata .link { min-width: 2.75rem; font-size: 1.3rem; text-decoration: none; } }
  /* gruppo dei comandi a destra: oggi il tema, in futuro anche la lingua */
  .comandi { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: .6rem; }

  /* Interruttore sole/luna, misurato in em sulla stessa --t del logo */
  .tema {
    font-size: var(--t, 1rem); flex: none; position: relative; width: 2.9em; height: 1.6em; padding: 0;
    border: 0; border-radius: 999px; background: #9ED3FF; box-shadow: 0 2px 0 rgba(31, 42, 68, .18);
  }
  /* area di tocco fissa da 64×44px, più grande dell'interruttore visibile (si allarga verso sinistra per non uscire dallo schermo) */
  .tema::before { content: ""; position: absolute; right: -6px; top: 50%; width: 64px; height: 44px; transform: translateY(-50%); }
  .tema .pomello {
    position: absolute; top: .18em; left: .18em; width: 1.24em; height: 1.24em; border-radius: 50%;
    display: grid; place-items: center; background: #fff; box-shadow: 0 .1em 0 rgba(0, 0, 0, .15);
    transition: transform .2s;
  }
  .tema svg { width: .9em; height: .9em; }
  .tema .sole { color: #FFB000; }
  .tema .luna { color: #FFE58A; display: none; }
  [data-tema="scuro"] .tema {
    background: radial-gradient(circle at 18% 32%, #fff .07em, transparent .11em),
                radial-gradient(circle at 32% 70%, #fff .055em, transparent .09em),
                radial-gradient(circle at 45% 38%, #fff .05em, transparent .085em), #3A4A8C;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  }
  /* corsa del pomello: larghezza - pomello - 2 margini = 2.9 - 1.24 - 0.36 */
  [data-tema="scuro"] .tema .pomello { transform: translateX(1.3em); background: #1B2440; }
  [data-tema="scuro"] .tema .sole { display: none; }
  [data-tema="scuro"] .tema .luna { display: block; }
  @media (prefers-reduced-motion: reduce) { .tema .pomello { transition: none; } }

  /* Tentativi */
  .tentativi { display: flex; align-items: center; gap: .3rem .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
  /* telefono: oltre 10 tentativi le palline vanno su due righe uguali (es. 10+10) */
  .palline { display: grid; grid-template-columns: repeat(var(--colonne, 10), 12px); gap: 3px; }
  .palline b { width: 12px; height: 12px; border-radius: 50%; background: var(--spento); }
  .palline b.usata { background: var(--rosso); }
  .tentativi small { font-weight: 700; color: var(--tenue); font-size: .95rem; }

  /* L'abaco dell'alfabeto: sul telefono due aste (A–M e N–Z), da 600px una sola */
  .abaco { --perla: min(22px, 5.6vw); --sopra: 1.15rem; display: flex; flex-direction: column; gap: .5rem; margin-bottom: .9rem; }
  /* --d è il diametro reale della perlina: al massimo --perla e mai oltre l'80% della colonna.
     Barra, filo e perline usano tutti --d, così restano allineati a ogni larghezza. */
  .asta { position: relative; padding-top: var(--sopra); }
  .asta .filo, .asta .zona, .asta .colori, .asta b { --d: var(--perla); }
  @supports (width: 1cqw) {
    .asta { container-type: inline-size; }
    .asta .filo, .asta .zona, .asta .colori, .asta b { --d: min(var(--perla), 100cqw / var(--n) * .8); }
  }
  .asta .filo { position: absolute; left: 0; right: 0; top: calc(var(--sopra) + 2px + var(--d) / 2 - 2px); height: 4px; background: var(--filo); border-radius: 2px; }
  /* La barra evidenziatrice fa da maschera: dentro c'è una copia colorata delle perline,
     ritagliata dai suoi bordi. Così le perline di confine restano colorate solo in parte. */
  .asta .zona { position: absolute; top: calc(var(--sopra) - 3px); height: calc(var(--d) + 10px); background: rgba(255, 194, 61, .35); border-radius: 999px; }
  .asta .zona.continua-sx { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .asta .zona.continua-dx { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .asta .colori { position: absolute; left: 0; right: 0; top: calc(var(--sopra) - 3px); height: calc(var(--d) + 10px); padding-top: 5px; display: grid; }
  .asta .colori i { display: flex; justify-content: center; align-items: flex-start; }
  /* la perlina non supera mai l'80% della sua colonna: resta sempre spazio tra una e l'altra */
  .asta .colori b { width: var(--d); aspect-ratio: 1; border-radius: 50%; }
  .asta .colori .c0 { background: var(--rosso); }
  .asta .colori .c1 { background: var(--giallo); }
  .asta .colori .c2 { background: var(--verde); }
  .asta .colori .c3 { background: var(--blu); }
  .asta .colori .c4 { background: var(--viola); }
  .asta .perle { position: relative; display: grid; }
  .asta .perla { display: flex; flex-direction: column; align-items: center; gap: 9px; } /* 5px di barra sotto la perlina + 4px di respiro */
  .asta .perla b { width: var(--d); aspect-ratio: 1; border-radius: 50%; background: var(--spento); margin-top: 2px; }
  .asta .perla span { font-size: clamp(.75rem, 3.4vw, 1rem); font-weight: 800; color: var(--tenue); padding: 0 3px; }
  .asta .perla.dentro span { color: var(--inchiostro); }
  .asta .perla.evidenza span { color: #fff; background: var(--rosso); border-radius: 6px; }
  .asta .segno { position: absolute; top: 0; transform: translateX(-50%); font-size: 1rem; line-height: 1; color: var(--inchiostro); }

  /* Le tre tessere: limite basso, parola in gioco, limite alto.
     Le parole lunghe si rimpiccioliscono da sole (vedi adattaTessere) */
  .intervallo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr) minmax(0, 1fr); gap: .35rem; align-items: stretch; margin-bottom: .9rem; }
  .tessera { border-radius: 16px; padding: .5rem .25rem .4rem; color: #fff; text-align: center; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .tessera small { font-size: .8rem; font-weight: 700; opacity: .9; }
  .tessera strong { display: block; font-size: 1.15rem; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  .tessera strong.a-capo { white-space: normal; overflow-wrap: anywhere; }
  .tessera.basso { background: var(--verde); }
  .tessera.alto { background: var(--viola); }
  .tessera.mezzo { background: var(--giallo); color: #3A2A00; }
  .tessera.mezzo strong { font-size: 1.4rem; }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

  .fumetto { display: flex; gap: .6rem; align-items: center; margin-bottom: .8rem; }
  .fumetto .faccia { font-size: 2.2rem; line-height: 1; }
  .fumetto p { margin: 0; font-weight: 700; font-size: 1.2rem; }
  /* Telefono: Prima e Dopo affiancati, «È lei!» sotto a tutta larghezza */
  .risposte { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .risposte .btn { padding-inline: .3rem; font-size: 1.15rem; min-height: 3.6rem; }
  .risposte .giusta { grid-column: 1 / -1; order: 3; }
  .domanda { margin: .7rem 0 0; font-size: .95rem; }

  .messaggio { min-height: 1.5em; font-weight: 700; margin: .7rem 0 0; }
  .messaggio.errore { color: var(--rosso); }

  .aiuto { margin-top: .9rem; border: 4px solid var(--rosso); border-radius: 16px; padding: .8rem; }
  .aiuto h3 { font-size: 1.15rem; margin-bottom: .3rem; }
  .aiuto p { margin-bottom: .6rem; }
  .alfabeto { display: flex; flex-wrap: wrap; gap: 2px; }
  .alfabeto span { width: 1.45rem; text-align: center; border-radius: 6px; font-weight: 800; color: var(--tenue); }
  .alfabeto span.si { background: var(--rosso); color: #fff; }

  .scelte-titolo { font-weight: 800; margin: 1rem 0 .5rem; }
  .scelte { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; max-width: 26rem; }
  .scelte button { font-weight: 800; font-size: 1.25rem; min-height: 3rem; padding: .2rem 0 0; border-radius: 14px; border: 4px solid var(--spento); background: var(--sfondo); color: var(--inchiostro); }
  .scelte button[aria-checked="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  #b-via { width: 100%; }

  /* Scelta dei gruppi di parole: pulsanti grandi da accendere e spegnere */
  .gruppi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin: .4rem 0 .6rem; }
  .gruppo {
    display: flex; align-items: center; gap: .5rem; text-align: left; min-height: 3.4rem;
    padding: .45rem .6rem; border-radius: 14px; border: 4px solid var(--spento);
    background: var(--sfondo); color: var(--inchiostro); font-weight: 800; font-size: 1rem; line-height: 1.15;
  }
  .gruppo .emoji { font-size: 1.5rem; line-height: 1; flex: none; }
  .gruppo span:last-child { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
  @media (max-width: 359px) { .gruppo { font-size: .9rem; gap: .35rem; padding-inline: .45rem; } .gruppo .emoji { font-size: 1.25rem; } }
  .gruppo .emoji { filter: grayscale(1); opacity: .55; }
  .gruppo[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .gruppo[aria-pressed="true"] .emoji { filter: none; opacity: 1; }
  .gruppi-azioni { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
  .gruppi-azioni .link { padding-left: 0; }
  #conta-parole { font-weight: 800; color: var(--tenue); }
  #conta-parole.zero { color: var(--rosso); }
  #b-via2 { width: 100%; }
  @media (min-width: 600px) {
    .gruppi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #b-via2 { width: auto; }
  }
  @media (min-width: 900px) { .gruppi { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  /* Riga sopra l'abaco: l'inizio comune delle parole possibili e, con il «?», la lettera mostrata sulle aste */
  .zoom { display: flex; align-items: center; gap: .5rem; font-weight: 700; color: var(--tenue); font-size: .95rem; min-height: 2.3rem; padding: .1rem .5rem; margin: 0 -.5rem; border-radius: 12px; }
  .zoom .caselle { gap: 3px; }
  .zoom .caselle span { width: 1.6rem; height: 1.9rem; font-size: 1.05rem; border-radius: 8px; }
  .zoom .caselle span.qui { border-color: var(--giallo); color: var(--inchiostro); }
  .zoom.nuovo { background: rgba(255, 194, 61, .35); color: var(--inchiostro); }
  /* Footer discreto: versione, codice, licenza e crediti */
  /* le voci vanno a capo intere, separate da spazio: nessun puntino resta appeso a fine riga */
  .piede { margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 1.1rem; font-size: .85rem; color: var(--tenue); text-align: center; }
  .piede > * { white-space: nowrap; padding: .3rem 0; }
  .piede a { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .aiutini { margin-top: .9rem; border: 4px dashed var(--giallo); border-radius: 16px; padding: .7rem .8rem; }
  .aiutini ul { margin: 0 0 .5rem; padding-left: 1.2rem; font-weight: 700; }
  .caselle { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .caselle span { width: 1.9rem; height: 2.3rem; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; background: var(--sfondo); border: 3px solid var(--spento); }
  .caselle span.piena { background: var(--rosso); border-color: var(--rosso); color: #fff; }
  .caselle span.puntini { border: 0; background: none; width: auto; color: var(--tenue); }
  #b-aiutino { flex: 1; }

  .storia-titolo { margin: 1.2rem 0 0; font-size: 1.05rem; }
  .lato.vuoto { display: none; }
  .storia li.vuota { background: none; border: 3px dashed var(--spento); color: var(--tenue); font-size: .95rem; }
  .storia { list-style: none; margin: .4rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
  .storia li { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; column-gap: .5rem; background: var(--sfondo); border-radius: 12px; padding: .3rem .7rem; }
  .storia li strong { font-weight: 800; letter-spacing: .03em; }
  .storia li em { font-style: normal; font-weight: 700; font-size: .9rem; }
  .storia li.prima em { color: var(--verde-scuro); }
  .storia li.dopo em { color: var(--viola-scuro); }
  [data-tema="scuro"] .storia li.prima em { color: var(--verde); }
  [data-tema="scuro"] .storia li.dopo em { color: #B394FF; }

  .fine { text-align: center; }
  .fine .grande { font-size: 4.2rem; line-height: 1; margin-bottom: .5rem; }
  .fine p { margin-inline: auto; }
  .fine .riga { flex-direction: column; align-items: stretch; }

  /* ===== Telefoni grandi e tablet in verticale ===== */
  @media (min-width: 600px) {
    body { font-size: 1.15rem; }
    main { padding-inline: max(1.25rem, env(safe-area-inset-left)); padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .pannello { padding: 1.5rem; border-radius: 24px; box-shadow: 0 6px 0 var(--ombra); }
    .logo.titolo { margin-bottom: 1.5rem; }
    .modi { grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modo { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; padding: 1.4rem; min-height: 200px; }
    .modo .emoji { font-size: 2.6rem; }
    .modo strong { font-size: 1.6rem; }
    .abaco { --perla: min(26px, 3vw); --sopra: 1.4rem; margin-bottom: 1.25rem; }
    .palline { display: flex; flex-wrap: wrap; }
    .palline b { width: 14px; height: 14px; }
    .intervallo { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr); gap: .6rem; margin-bottom: 1.25rem; }
    .tessera { padding: .7rem .6rem .5rem; border-radius: 18px; }
    .tessera small { font-size: .9rem; }
    .tessera strong { font-size: 1.7rem; }
    .tessera.mezzo strong { font-size: 2rem; }
    .risposte { grid-template-columns: 1fr auto 1fr; }
    .risposte .giusta { grid-column: auto; order: 0; padding-inline: 1.2rem; }
    .risposte .btn { font-size: 1.25rem; }
    .caselle span { width: 2.2rem; height: 2.6rem; font-size: 1.4rem; }
    #b-aiutino { flex: none; }
    #b-via { width: auto; }
    .fine .grande { font-size: 5rem; }
    .fine .riga { flex-direction: row; justify-content: center; }
  }

  /* ===== Tablet in orizzontale e computer: le parole provate vanno a lato ===== */
  @media (min-width: 900px) {
    body[data-schermata="s-gioco"] main { max-width: 1040px; }
    .gioco { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 1.75rem; align-items: start; }
    .gioco .abaco { --perla: min(20px, 1.9vw); }
    .gioco .lato { border-left: 3px solid var(--sfondo); padding-left: 1.5rem; }
    .gioco .storia-titolo { margin-top: 0; }
    .gioco .lato.vuoto { display: block; }
    .gioco .storia { max-height: 60vh; overflow-y: auto; }
    .storia li em { font-size: .85rem; }
  }

  /* Interruttore della lingua: stessa forma di quello del tema, con le bandiere nel pomello.
     Compare solo nelle schermate del nome e del menu, a sinistra nella testata. */
  .lingua {
    grid-column: 1; justify-self: start;
    font-size: var(--t, 1rem); position: relative; width: 2.9em; height: 1.6em; padding: 0;
    border: 0; border-radius: 999px; background: #BFD4EC; box-shadow: 0 2px 0 rgba(31, 42, 68, .18);
  }
  [data-tema="scuro"] .lingua { background: #3A4868; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .lingua::before { content: ""; position: absolute; left: -6px; top: 50%; width: 64px; height: 44px; transform: translateY(-50%); }
  /* pomello identico a quello sole/luna (stesso sfondo, misura e ombra), con dentro la bandiera tonda
     grande come il sole e la luna */
  .lingua .pomello {
    position: absolute; top: .18em; left: .18em; width: 1.24em; height: 1.24em; border-radius: 50%;
    display: grid; place-items: center; background: #fff; box-shadow: 0 .1em 0 rgba(0, 0, 0, .15);
    transition: transform .2s;
  }
  [data-tema="scuro"] .lingua .pomello { background: #1B2440; }
  .lingua .pomello svg { display: block; width: .9em; height: .9em; border-radius: 50%; }
  .lingua .pomello .uk { display: none; }
  .lingua[aria-checked="true"] .pomello { transform: translateX(1.3em); }
  .lingua[aria-checked="true"] .pomello .it { display: none; }
  .lingua[aria-checked="true"] .pomello .uk { display: block; }
  @media (prefers-reduced-motion: reduce) { .lingua .pomello { transition: none; } }
</style>

    storiaPrima: "⬅ the secret comes before", storiaDopo: "the secret comes after ➡",
    aiutoSemplice: "It’s a simple word.",
    aiutoInizio: L => `It starts with the letter ${L}.`, aiutoFine: L => `It ends with the letter ${L}.`,
    aiutoLunga: n => `It has ${n} letters.`, aiutoBottone: (n, t) => `💡 Hint ${n} of ${t}`,
    arrendo: "I give up",
    haiVinto: "You win",
    fineCpuTentativi: (n, W) => `The computer used all ${n} guesses and didn’t find ${W}.`,

    ancora: "Play again", cambiaGioco: "Change game",
    piedeCodice: "Source on GitHub", piedeLicenza: "MIT License",

    zoomInizio: "They start with",
    zoomAria: (n, P) => (P ? `The possible words start with ${P}: the abacus shows letter number ${n}.` : "The abacus shows the first letter of the possible words."),
    catTitolo: "Which words shall we play with?",
    catInfo: "Pick one or more groups. With just one group you already know what kind of word the secret is.",

    contaParole: n => (n === 0 ? "Pick at least one group" : n === 1 ? "1 word" : `${n} words`)
  }
};

/* ===== Utilità ===== */
const $ = id => document.getElementById(id);
const norm = s => s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
const M = s => s.toUpperCase();
const caso = n => Math.floor(Math.random() * n);

// Lingua iniziale: la prima lingua supportata nell'elenco delle preferenze del browser
// (es. tedesco, poi italiano → italiano). Se nessuna è supportata, inglese.
function linguaIniziale() {
  const preferite = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
  for (const l of preferite) {
    const codice = l.toLowerCase().slice(0, 2);
    if (codice in LINGUE) return codice;
  }
  return "en";
}
let lingua = linguaIniziale();
let L, INIZIO, FINE, DIZ, AIUTO_CATEGORIA;
const t = (chiave, ...arg) => {
  const v = TESTI[lingua][chiave];
  return typeof v === "function" ? v(...arg) : v;
};
// parametri comuni dei testi fissi: estremi e parola d'esempio, in maiuscolo
const estremi = () => [M(INIZIO), M(FINE), M(L.esempio)];

// Parole dei gruppi scelti, nella lingua attuale
function paroleInGioco() {
  return [...new Set(L.categorie.filter(c => stato.gruppi.has(c.gruppo)).flatMap(c => c.parole).map(norm))].sort(cmp);
}

function caricaParole() {
  L = LINGUE[lingua];
  INIZIO = L.inizio;
  FINE = L.fine;
  DIZ = [...new Set(L.categorie.flatMap(c => c.parole).map(norm))].sort(cmp);
  AIUTO_CATEGORIA = new Map();
  L.categorie.forEach(c => c.parole.forEach(w => AIUTO_CATEGORIA.set(norm(w), c.aiuto)));
}

const stato = {
  nome: "", buffo: null, modo: 0, segreta: "", basso: "", alto: "",
  storia: [], ipotesi: null, attesa: false, aiuti: 0, aiutiGratis: 0, livelloPrima: 0, dizCpu: [], maxCpu: MAX_TENTATIVI_CPU,
  gruppi: new Set(GRUPPI.map(g => g.id)) // all'inizio tutti i gruppi sono scelti
};
const maxTentativi = () => (stato.modo === 1 ? stato.maxCpu : MAX_TENTATIVI_TU);

// Il nome a sorpresa è salvato come coppia di posizioni, così si traduce cambiando lingua
function nomeVisibile() {
  if (!stato.buffo) return stato.nome;
  const [i, j] = stato.buffo;
  return L.componiNome(L.nomiBuffi[i], L.aggettiviBuffi[j], L.generi[i]);
}
const conNome = s => (nomeVisibile() ? `${s}, ${nomeVisibile()}!` : `${s}!`);

function applicaTesti() {
  document.documentElement.lang = lingua;
  const [I, F, E] = estremi();
  document.title = t("titoloPagina", I, F);
  document.querySelectorAll(".logo .da").forEach(e => (e.textContent = I));
  document.querySelectorAll(".logo .a").forEach(e => (e.textContent = F));
  document.querySelectorAll("[data-t]").forEach(e => (e.textContent = t(e.dataset.t, I, F, E)));
  document.querySelectorAll("[data-t-ph]").forEach(e => (e.placeholder = t(e.dataset.tPh)));
  document.querySelectorAll("[data-t-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.tAria)));
  $("b-lingua").setAttribute("aria-checked", String(lingua === "en"));
  $("b-lingua").title = t("linguaTitolo");
  if (nomeVisibile()) $("saluto").textContent = t("saluto", nomeVisibile());
  disegnaGruppi();
  applicaTema(document.documentElement.dataset.tema);
}

$("b-lingua").onclick = () => {
  lingua = lingua === "it" ? "en" : "it";
  caricaParole();
  applicaTesti();
};

// Scelta dei tentativi del computer
function disegnaScelte() {
  $("scelte-tentativi").innerHTML = OPZIONI_TENTATIVI_CPU.map(n =>
    `<button role="radio" aria-checked="${n === stato.maxCpu}" data-n="${n}">${n}</button>`).join("");
  $("scelte-tentativi").querySelectorAll("button").forEach(b => (b.onclick = () => {
    stato.maxCpu = Number(b.dataset.n);
    disegnaScelte();
    $("scelte-tentativi").querySelector(`[data-n="${b.dataset.n}"]`).focus();
  }));
}

function mostra(id) {
  document.querySelectorAll(".schermata").forEach(s => (s.hidden = s.id !== id));
  document.body.dataset.schermata = id;

/* ===== Nome e menu ===== */
function salvaNome(nome) {
  const n = nome.trim();
  stato.nome = n ? n.charAt(0).toUpperCase() + n.slice(1) : "";
  stato.buffo = n ? null : [caso(L.nomiBuffi.length), caso(L.aggettiviBuffi.length)];
  $("saluto").textContent = t("saluto", nomeVisibile());
  mostra("s-menu");
}
$("b-nome").onclick = () => salvaNome($("in-nome").value);
$("in-nome").addEventListener("keydown", e => { if (e.key === "Enter") salvaNome($("in-nome").value); });
$("b-salta").onclick = () => salvaNome("");
$("b-cambia-nome").onclick = () => { mostra("s-nome"); $("in-nome").focus(); };
document.querySelectorAll("[data-menu]").forEach(b => (b.onclick = () => mostra("s-menu")));
$("b-modo1").onclick = () => avviaModo1();
$("b-modo2").onclick = () => { disegnaGruppi(); mostra("s-categorie"); };
$("b-ancora").onclick = () => (stato.modo === 1 ? avviaModo1() : avviaModo2());

/* ===== Parte comune della partita ===== */
function nuovaPartita(modo) {
  Object.assign(stato, { modo, basso: INIZIO, alto: FINE, storia: [], ipotesi: null, attesa: false, aiuti: 0, aiutiGratis: 0, livelloPrima: 0 });
  $("area-cpu").hidden = modo !== 1;
  $("area-tu").hidden = modo !== 2;
  $("aiuto").hidden = true;
  $("msg-prova").textContent = "";
  disegnaAiuti();
}

// Posizione di una parola sull'abaco, da 0 (A) a 26 (fine della Z)
function posizione(w) {
  let p = w.charCodeAt(0) - 97, d = 1;
  for (let k = 1; k < Math.min(w.length, 6); k++) { d *= 27; p += (w.charCodeAt(k) - 96) / d; }
  return Math.min(25.999, p);
}

function disegna(evidenzia = lettereAiuti(), livelloEvidenza = 0) {
  // palline dei tentativi
  const usati = stato.storia.length;
  const totale = maxTentativi();
  $("palline").style.setProperty("--colonne", totale > 10 ? Math.ceil(totale / 2) : totale);
  $("palline").innerHTML = Array.from({ length: totale }, (_, i) => `<b class="${i < usati ? "usata" : ""}"></b>`).join("");
  $("conta").textContent = t("conta", totale - usati);

  disegnaAbaco(evidenzia, livelloEvidenza);

  // tessere
  $("t-basso").textContent = M(stato.basso);
  $("t-alto").textContent = M(stato.alto);
  adattaTessere();

  // parole provate (la più recente in alto)
  $("lato").classList.toggle("vuoto", usati === 0);
  $("storia").innerHTML = usati === 0
    ? `<li class="vuota">${t("storiaVuota")}</li>`
    : stato.storia.slice().reverse().map(s =>
      `<li class="${s.verso}"><strong>${M(s.parola)}</strong><em>${t(s.verso === "prima" ? "storiaPrima" : "storiaDopo")}</em></li>`
    ).join("");
}

// Sul telefono l'abaco ha due aste (A–M e N–Z), da 600px in su una sola
const schermoStretto = window.matchMedia("(max-width: 599px)");
function disegnaAbaco(evidenzia, livelloEvidenza) {
  const aste = schermoStretto.matches ? 2 : 1;
  const perAsta = 26 / aste;
  // Zoom: se i due limiti iniziano con le stesse lettere, l'abaco mostra la lettera successiva.
  // Ogni parola tra i due limiti ha per forza lo stesso inizio, quindi basta guardare il resto.
  const k = inizioComune(stato.basso, stato.alto);
  const prefisso = stato.alto.slice(0, k);
  const pos = w => (w.length ? posizione(w) : 0);
  // gli estremi del dizionario valgono come inizio della A e fine della Z
  const pb = k === 0 && stato.basso === INIZIO ? 0 : pos(stato.basso.slice(k));
  const pa = k === 0 && stato.alto === FINE ? 26 : pos(stato.alto.slice(k));
  const pi = stato.ipotesi && stato.ipotesi.startsWith(prefisso) ? pos(stato.ipotesi.slice(k)) : null;
  // le lettere si evidenziano solo se riguardano la posizione che l'abaco sta mostrando
  if (livelloEvidenza !== k) evidenzia = [];
  // la riga sopra l'abaco resta accesa finché il prossimo tentativo non cambia i limiti
  const nuovoLivello = k > stato.livelloPrima;
  let html = "";
  for (let r = 0; r < aste; r++) {
    const da = r * perAsta, a = da + perAsta;
    const lo = Math.max(pb, da), hi = Math.min(pa, a);
    const lettere = ALFABETO.slice(da, a);
    const griglia = `grid-template-columns:repeat(${perAsta},minmax(0,1fr))`;
    // barra evidenziatrice con dentro le perline colorate, allineate a quelle grigie sotto
    let zona = "";
    if (hi > lo) {
      const sx = (lo - da) / perAsta * 100, dx = (hi - da) / perAsta * 100;
      // sul telefono, dove la barra prosegue sull'altra asta, il bordo resta dritto
      const continuaSx = r > 0 && lo === da, continuaDx = r < aste - 1 && hi === a;
      // agli estremi dell'alfabeto la barra sborda di qualche pixel, così la curva non taglia A e Z
      const extSx = lo === 0 ? 6 : 0, extDx = hi === 26 ? 6 : 0;
      const cls = ["zona", continuaSx ? "continua-sx" : "", continuaDx ? "continua-dx" : ""].join(" ");
      zona = `<div class="${cls}" style="left:calc(${sx}% - ${extSx}px);width:calc(${dx - sx}% + ${extSx + extDx}px)"></div>`;
      // le perline colorate sono ritagliate con la stessa forma della barra
      const sxR = continuaSx ? "0" : "999px", dxR = continuaDx ? "0" : "999px";
      const ritaglio = `inset(0 calc(${100 - dx}% - ${extDx}px) 0 calc(${sx}% - ${extSx}px) round ${sxR} ${dxR} ${dxR} ${sxR})`;
      const colori = lettere.map((l, j) => `<i><b class="c${(da + j) % 5}"></b></i>`).join("");
      zona += `<div class="colori" style="${griglia};clip-path:${ritaglio};-webkit-clip-path:${ritaglio}">${colori}</div>`;
    }
    const segno = pi !== null && pi >= da && pi < a
      ? `<div class="segno" style="left:${(pi - da) / perAsta * 100}%">▼</div>` : "";
    const perle = lettere.map((l, j) => {
      const i = da + j;
      const dentro = i + 1 > pb && i < pa;
      const cls = ["perla", dentro ? "dentro" : "", evidenzia.includes(l) ? "evidenza" : ""].join(" ");
      return `<div class="${cls}"><b></b><span>${M(l)}</span></div>`;
    }).join("");
    html += `<div class="asta" style="--n:${perAsta}"><div class="filo"></div><div class="perle" style="${griglia}">${perle}</div>${zona}${segno}</div>`;
  }
  const caselle = [...prefisso].map(c => `<span class="piena">${M(c)}</span>`).join("") + `<span class="qui">?</span>`;
  $("abaco").innerHTML = `<div class="zoom${nuovoLivello ? " nuovo" : ""}"><span>${t("zoomInizio")}</span><span class="caselle">${caselle}</span></div>` + html;
  $("abaco").setAttribute("aria-label", t("zoomAria", k + 1, M(prefisso)));
}

// Rimpicciolisce le parole lunghe (es. ZUZZURELLONE) finché stanno nella tessera
function adattaTessere() {
  document.querySelectorAll(".tessera strong").forEach(el => {
    el.style.fontSize = "";
    el.classList.remove("a-capo");
    let size = parseFloat(getComputedStyle(el).fontSize) || 16;
    while (el.scrollWidth > el.clientWidth && size > 11) {
      size -= 1;
      el.style.fontSize = size + "px";
    }
    if (el.scrollWidth > el.clientWidth) el.classList.add("a-capo");
  });
}

function ridisegnaSeInGioco() { if (!$("s-gioco").hidden) disegna(); }
schermoStretto.addEventListener("change", ridisegnaSeInGioco);
let attesaResize;
window.addEventListener("resize", () => { clearTimeout(attesaResize); attesaResize = setTimeout(adattaTessere, 120); });

// Con mouse e tastiera il campo resta attivo dopo ogni tentativo; sul touch la tastiera
// si chiude, così il bambino vede abaco e tessere aggiornati
const puntatorePreciso = window.matchMedia("(pointer: fine)");
function attivaCampo(dopoTentativo) {
  if (puntatorePreciso.matches) $("in-prova").focus();
  else if (dopoTentativo) $("in-prova").blur();
}
// Sul telefono, quando si apre la tastiera, tiene in vista tessere e campo
$("in-prova").addEventListener("focus", () => {
  if (puntatorePreciso.matches) return;
  setTimeout(() => $("intervallo").scrollIntoView({ block: "start", behavior: "smooth" }), 300);
});

// Quante lettere iniziali hanno in comune due parole
function inizioComune(a, b) {
  let k = 0;
  while (k < a.length && k < b.length && a[k] === b[k]) k++;
  return k;
}

function registra(parola, verso) {
  stato.livelloPrima = inizioComune(stato.basso, stato.alto);
  stato.storia.push({ parola, verso });
  if (verso === "prima") stato.alto = parola; else stato.basso = parola;
}

function fine(emoji, titolo, testo) {
  $("f-emoji").textContent = emoji;
  $("f-titolo").textContent = titolo;
  $("f-testo").textContent = testo;
  mostra("s-fine");
}

/* ===== Modalità 1: tu pensi, il computer indovina ===== */
function avviaModo1() {
  nuovaPartita(1);
  $("in-segreta").value = "";
  $("in-segreta").type = "password";
  $("b-occhio").textContent = t("mostra");
  $("b-occhio").setAttribute("aria-pressed", "false");
  $("msg-segreta").textContent = "";

}

$("b-occhio").onclick = () => {
  const nascosta = $("in-segreta").type === "password";
  $("in-segreta").type = nascosta ? "text" : "password";
  $("b-occhio").textContent = t(nascosta ? "nascondi" : "mostra");
  $("b-occhio").setAttribute("aria-pressed", String(nascosta));
};

function confermaSegreta() {
  const p = norm($("in-segreta").value);
  const err = $("msg-segreta");
  if (!p) return (err.textContent = t("errVuota"));
  if (!/^[a-z]+$/.test(p)) return (err.textContent = t("errLettere"));
  if (!(cmp(p, INIZIO) > 0 && cmp(p, FINE) < 0)) return (err.textContent = t("errFuori", M(INIZIO), M(FINE)));
  stato.segreta = p;
  // il computer conosce solo un piccolo gruppo di parole, diverso a ogni partita
  stato.dizCpu = DIZ.slice().sort(() => Math.random() - 0.5).slice(0, PAROLE_CPU).sort(cmp);
  mostra("s-gioco");
  turnoCpu();
}
$("b-via").onclick = confermaSegreta;
$("in-segreta").addEventListener("keydown", e => { if (e.key === "Enter") confermaSegreta(); });

function turnoCpu() {
  $("aiuto").hidden = true;
  if (stato.storia.length >= stato.maxCpu) {
    return fine("🏆", conNome(t("haiVinto")), t("fineCpuTentativi", stato.maxCpu, M(stato.segreta)));
  }
  const candidate = stato.dizCpu.filter(w => cmp(w, stato.basso) > 0 && cmp(w, stato.alto) < 0);
  if (!candidate.length) {
    return fine("🏆", conNome(t("haiVinto")), t("fineCpuNessuna", M(stato.basso), M(stato.alto), M(stato.segreta)));
  }
  // metà dell'intervallo, più un po' di rumore
  const meta = (candidate.length - 1) / 2;
  const spostamento = (Math.random() * 2 - 1) * candidate.length * RUMORE;
  const i = Math.max(0, Math.min(candidate.length - 1, Math.round(meta + spostamento)));

  stato.ipotesi = null;
  stato.attesa = true;
  bottoniCpu(false);
  $("cpu-dice").textContent = t("cpuPensa");
  $("t-mezzo-et").textContent = t("tCpu");
  $("t-mezzo").textContent = "…";
  disegna();

  setTimeout(() => {
    stato.ipotesi = candidate[i];
    stato.attesa = false;
    $("cpu-dice").textContent = t("cpuChiede", M(stato.ipotesi));
    const el = $("t-mezzo");
    el.textContent = M(stato.ipotesi);
    el.parentElement.classList.remove("pop"); void el.offsetWidth; el.parentElement.classList.add("pop");
    bottoniCpu(true);
    disegna();
  }, 650);
}

function bottoniCpu(attivi) {
  document.querySelectorAll("#area-cpu [data-r]").forEach(b => (b.disabled = !attivi));
}
document.querySelectorAll("#area-cpu [data-r]").forEach(b => (b.onclick = () => rispondi(b.dataset.r)));

function rispondi(r) {
  if (stato.attesa || !stato.ipotesi) return;
  const g = stato.ipotesi;
  const c = cmp(stato.segreta, g);
  const vera = c < 0 ? "prima" : c > 0 ? "dopo" : "giusta";

  if (r !== vera) return mostraAiuto(g, vera);

  if (vera === "giusta") {
    return fine("🤖", t("fineCpuVince"), t("fineCpuVinceTesto", M(g), stato.storia.length + 1, stato.maxCpu));
  }
  registra(g, vera);
  turnoCpu();
}

function mostraAiuto(g, vera) {
  let testo, lettere = [], livello = 0;
  if (vera === "giusta") {
    testo = t("aiutoGiusta", M(g));
  } else {
    const s = spiega(stato.segreta, g);
    testo = s.testo;
    lettere = s.lettere;
    livello = s.livello;
  }
  $("aiuto-testo").innerHTML = testo;
  $("aiuto-alfabeto").innerHTML = lettere.length
    ? ALFABETO.map(l => `<span class="${lettere.includes(l) ? "si" : ""}">${M(l)}</span>`).join("")
    : "";
  $("aiuto").hidden = false;
  disegna(lettere, livello);
}

// Spiega a parole perché "a" viene prima o dopo "b"
function spiega(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  const A = M(a), B = M(b);
  let testo = t("spTua", A);
  if (i === 1) testo += t("spUna", M(a[0]));
  if (i > 1) testo += t("spPiu", i, M(a.slice(0, i)));
  let lettere = [], livello = 0;
  if (i === a.length || i === b.length) {
    testo += t("spCorta", a.length < b.length ? A : B);
  } else {
    const la = a[i], lb = b[i];
    const [x, y] = la < lb ? [la, lb] : [lb, la];
    testo += t("spLettera", i + 1, A, M(la), B, M(lb), M(x), M(y));
    lettere = [la, lb];
  }
  livello = i;
  testo += t("spQuindi", A, cmp(a, b) < 0, B);
  return { testo, lettere, livello };
}

/* ===== Modalità 2: il computer pensa, tu indovini ===== */
function avviaModo2() {
  nuovaPartita(2);
  const parole = paroleInGioco();
  stato.segreta = parole[caso(parole.length)];
  // se tutte le parole in gioco sono della stessa categoria, il primo aiuto (la categoria) è già noto: lo diamo gratis
  const categorie = new Set(parole.map(w => AIUTO_CATEGORIA.get(w)));
  stato.aiutiGratis = categorie.size === 1 ? 1 : 0;
  stato.aiuti = stato.aiutiGratis;
  $("t-mezzo-et").textContent = t("tSegreta");
  $("t-mezzo").textContent = "?";
  $("in-prova").value = "";
  disegnaAiuti();
  mostra("s-gioco");
  disegna();
  attivaCampo(false);
}

function disegnaGruppi() {
  $("gruppi").innerHTML = GRUPPI.map(g =>
    `<button class="gruppo" data-g="${g.id}" aria-pressed="${stato.gruppi.has(g.id)}"><span class="emoji" aria-hidden="true">${g.emoji}</span><span>${g[lingua]}</span></button>`
  ).join("");
  $("gruppi").querySelectorAll(".gruppo").forEach(b => (b.onclick = () => {
    const id = b.dataset.g;
    if (stato.gruppi.has(id)) stato.gruppi.delete(id); else stato.gruppi.add(id);
    disegnaGruppi();
    $("gruppi").querySelector(`[data-g="${id}"]`).focus();
  }));
  const tutti = stato.gruppi.size === GRUPPI.length;
  $("b-tutti").textContent = t(tutti ? "nessuno" : "tutti");
  const n = paroleInGioco().length;
  $("conta-parole").textContent = t("contaParole", n);
  $("conta-parole").classList.toggle("zero", n === 0);
  $("b-via2").disabled = n === 0;
}
$("b-tutti").onclick = () => {
  stato.gruppi = stato.gruppi.size === GRUPPI.length ? new Set() : new Set(GRUPPI.map(g => g.id));
  disegnaGruppi();
};
$("b-via2").onclick = () => avviaModo2();

function avvisa(testo, errore = false) {
  const m = $("msg-prova");
  m.textContent = testo;
  m.classList.toggle("errore", errore);
}

function prova() {
  const p = norm($("in-prova").value);
  if (!p) return avvisa(t("errVuotaProva"), true);
  if (!/^[a-z]+$/.test(p)) return avvisa(t("errLettere"), true);
  if (stato.storia.some(s => s.parola === p)) return avvisa(t("errGia", M(p)), true);
  if (!(cmp(p, stato.basso) > 0 && cmp(p, stato.alto) < 0)) {
    return avvisa(t("errFuori", M(stato.basso), M(stato.alto)), true);
  }
  $("in-prova").value = "";
  const c = cmp(stato.segreta, p);
  if (c === 0) {
    return fine("🎉", conNome(t("trovata")), t("trovataTesto", M(p), stato.storia.length + 1, MAX_TENTATIVI_TU));
  }
  registra(p, c < 0 ? "prima" : "dopo");
  if (stato.storia.length >= MAX_TENTATIVI_TU) {
    return fine("🙈", t("finiti"), t("finitiTesto", M(stato.segreta)));
  }
  avvisa(t(c < 0 ? "msgPrima" : "msgDopo", M(p)));
  disegna();
  attivaCampo(true);
}
$("b-prova").onclick = prova;
$("in-prova").addEventListener("keydown", e => { if (e.key === "Enter") prova(); });

// Aiuti incrementali, in quest'ordine: 1) categoria, 2) lettera iniziale, 3) lettera finale, 4) lunghezza
function lettereAiuti() {
  if (stato.modo !== 2) return [];
  const s = stato.segreta, l = [];
  if (stato.aiuti >= 2) l.push(s[0]);
  if (stato.aiuti >= 3) l.push(s[s.length - 1]);
  return l;
}

function disegnaAiuti() {
  const s = stato.segreta, n = stato.aiuti;
  $("aiutini").hidden = n === 0;
  const frasi = [];
  if (n >= 1) frasi.push(AIUTO_CATEGORIA.get(s) || t("aiutoSemplice"));
  if (n >= 2) frasi.push(t("aiutoInizio", M(s[0])));
  if (n >= 3) frasi.push(t("aiutoFine", M(s[s.length - 1])));
  if (n >= 4) frasi.push(t("aiutoLunga", s.length));
  $("aiutini-lista").innerHTML = frasi.map(f => `<li>${f}</li>`).join("");

  let caselle = "";
  if (n >= 4) {
    caselle = [...s].map((c, i) => (i === 0 || i === s.length - 1)
      ? `<span class="piena">${M(c)}</span>` : "<span></span>").join("");
  } else if (n >= 2) {
    caselle = `<span class="piena">${M(s[0])}</span><span class="puntini">…</span>` +
      (n >= 3 ? `<span class="piena">${M(s[s.length - 1])}</span>` : "");
  }
  $("caselle").innerHTML = caselle;

  $("b-aiutino").hidden = n >= NUM_AIUTI;
  // gli aiuti dati gratis non si contano: con la categoria già nota il bottone dice «Aiuto 1 di 3»
  const g = stato.aiutiGratis;
  $("b-aiutino").textContent = t("aiutoBottone", n + 1 - g, NUM_AIUTI - g);
  $("b-arrendo").hidden = n < NUM_AIUTI;
}

$("b-aiutino").onclick = () => {
  if (stato.aiuti >= NUM_AIUTI) return;
  stato.aiuti++;
  disegnaAiuti();
  disegna();
};
$("b-arrendo").onclick = () => fine("🏳️", t("arreso"), t("arresoTesto", M(stato.segreta)));

/* ===== Tema chiaro/scuro ===== */
const scuroSistema = window.matchMedia("(prefers-color-scheme: dark)");
let temaScelto = false; // finché il bambino non tocca l'interruttore, il gioco segue il dispositivo
function applicaTema(tema) {
  const scuro = tema === "scuro";
  document.documentElement.dataset.tema = tema;
  $("b-tema").setAttribute("aria-checked", String(scuro));
  $("b-tema").title = t(scuro ? "temaChiaroTitolo" : "temaScuroTitolo");
  document.querySelector('meta[name="theme-color"]').content = scuro ? "#172036" : "#E3F2FF";
}
$("b-tema").onclick = () => {
  temaScelto = true;
  applicaTema(document.documentElement.dataset.tema === "scuro" ? "chiaro" : "scuro");
};
scuroSistema.addEventListener("change", e => { if (!temaScelto) applicaTema(e.matches ? "scuro" : "chiaro"); });

/* ===== Avvio ===== */
$("versione").textContent = "v" + VERSIONE;
caricaParole();
applicaTesti();
mostra("s-nome");
if (puntatorePreciso.matches) $("in-nome").focus();
</script>
